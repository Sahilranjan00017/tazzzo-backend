# Test contexts keep the pre-DB-3 flag-driven startup (mode LEGACY, environment test) so they never depend on a
# prior migration run. The default for a normally started application is VERIFY (see application.yml).
# The legacy seed flag preserves what the suites relied on when application.yml loaded the taxonomy seed.
tazzzo.migration.mode=LEGACY
tazzzo.migration.environment=test
tazzzo.schema.load-taxonomy-seed=true
