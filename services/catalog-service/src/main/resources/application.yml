spring:
  mvc:
    formcontent:
      filter:
        # No endpoint reads form-urlencoded bodies (every body is JSON; query parameters stay with the container).
        # FormContentFilter would decode a PUT/PATCH/DELETE form body with URLDecoder and throw outside controller
        # advice on a malformed one (%ZZ), answering Boot's default error JSON. Disabled; FormContentFilterDisabledIT.
        enabled: false
  http:
    converters:
      # Boot 4 prefers Jackson 3; this step of the Boot 4 migration keeps Jackson 2 (ADR-016).
      preferred-json-mapper: jackson2
  servlet:
    multipart:
      # No endpoint accepts multipart (media goes straight to object storage, imports are JSON). Without a
      # multipart resolver or a multipart config on the dispatcher servlet, Tomcat never parses parts, so the
      # multipart DoS class (CVE-2025-48988, CVE-2025-52520, CVE-2025-61795) has no entry point. MultipartDisabledIT.
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: ${TAZZZO_SHUTDOWN_GRACE:25s}
  task:
    scheduling:
      pool:
        size: 4          # M2: four workers, four threads — no head-of-line blocking
  application:
    name: tazzzo-catalog-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/tazzzo?replicaSet=rs0}
    database: ${MONGODB_DATABASE:tazzzo}
springdoc:
  api-docs:
    # springdoc 3 defaults to OpenAPI 3.1; the published contract is 3.0.1 and stays so in this migration step.
    version: openapi_3_0
tazzzo:
  # R5 (DB-3): a normally started application NEVER mutates the database schema. Evolution is done by the
  # explicit, locked, recorded migration job (docs/database/DATABASE_MIGRATION_RUNBOOK.md).
  #   VERIFY (default)   read-only; refuses to start if required migrations are not recorded as applied
  #   DRY_RUN / APPLY    migration job modes (set tazzzo.migration.exit-after-run=true for a one-shot job)
  #   APPLY_ON_STARTUP   local/dev convenience only; refused for staging/production
  #   LEGACY             pre-DB-3 flag behaviour below; local/test/dev only (used by the test suites)
  migration:
    mode: ${TAZZZO_MIGRATION_MODE:VERIFY}
    environment: ${TAZZZO_MIGRATION_ENVIRONMENT:}           # local | test | dev | staging | production
    confirm-database: ${TAZZZO_MIGRATION_CONFIRM_DATABASE:} # two-key confirmation for APPLY outside local/test/dev
    confirm-environment: ${TAZZZO_MIGRATION_CONFIRM_ENVIRONMENT:}
    operator: ${TAZZZO_MIGRATION_OPERATOR:}
    build-version: ${TAZZZO_BUILD_VERSION:unknown}
    exit-after-run: ${TAZZZO_MIGRATION_EXIT_AFTER_RUN:false}
  # DB-4: fail-fast datastore verification (docs/database/DATABASE_STAGING_RUNBOOK.md). For staging/production the
  # connection string must state the explicit contract (TLS, retry, w=majority, read concern, timeouts, pool) and the
  # connected identity must hold exactly the privileges of its profile (runtime in VERIFY; migrator in APPLY).
  #   AUTO     (default) enforced for staging/production; advisory log line elsewhere
  #   ENFORCE  enforced in every environment
  # There is deliberately no value that disables enforcement for staging or production.
  datastore:
    privilege-verification: ${TAZZZO_DATASTORE_PRIVILEGE_VERIFICATION:AUTO}
  schema:
    # Honoured ONLY in mode LEGACY (local/test/dev). They are false by default: bootstrap/seed are migrations now.
    bootstrap-on-startup: false
    load-taxonomy-seed: false
  scheduler:
    enabled: ${TAZZZO_SCHEDULER_ENABLED:true}   # operational layer; workers are idempotent
    merge-finalizer-ms: 30000
    taint-ms: 30000
    stamp-ms: 30000
    rollup-ms: 3600000
    rollup-lag-seconds: 120                     # never aggregate events younger than this
    taint-batch-size: 100
    stamp-batch-size: 100
  media:
    # Object storage for product images. provider: disabled (uploads refused, media sets metadata-only) | s3.
    # For AWS: bucket + region; credentials from the task role. endpoint/path-style/access-key/secret-key are for an
    # S3-compatible local store (MinIO) only. See docs/ops/MEDIA_STORAGE.md.
    storage:
      provider: ${TAZZZO_MEDIA_STORAGE_PROVIDER:disabled}
      s3:
        bucket: ${TAZZZO_MEDIA_S3_BUCKET:}
        region: ${TAZZZO_MEDIA_S3_REGION:ap-south-1}
        endpoint: ${TAZZZO_MEDIA_S3_ENDPOINT:}
        path-style: ${TAZZZO_MEDIA_S3_PATH_STYLE:false}
        presign-ttl-seconds: ${TAZZZO_MEDIA_S3_PRESIGN_TTL_SECONDS:300}
        access-key: ${TAZZZO_MEDIA_S3_ACCESS_KEY:}
        secret-key: ${TAZZZO_MEDIA_S3_SECRET_KEY:}

  auth:
    # NO DEFAULTS BY DESIGN: an unset token disables that role entirely (fail-closed).
    cms-token: ${TAZZZO_CMS_TOKEN:}
    read-token: ${TAZZZO_READ_TOKEN:}
  admin:
    # Human admin Google OIDC. ALL-OR-NOTHING: every value empty => human OIDC DISABLED and only the
    # service tokens above authenticate; any value set => issuer, audience, hosted-domain and
    # credential-label are ALL required, else startup fails. None is secret (no client secret is
    # used). Keys come from Google's published JWKS (tazzzo.admin.oidc.jwks-uri overrides; https only).
    # The allowlist (tazzzo.admin.users[n].provider/subject/email/roles/enabled) has no default and
    # requires OIDC; identity is the Google `sub`, roles come only from this list. Must be identical
    # on every instance (deployment gate 3).
    oidc:
      issuer: ${TAZZZO_ADMIN_OIDC_ISSUER:}                      # https://accounts.google.com
      audience: ${TAZZZO_ADMIN_OIDC_AUDIENCE:}                  # admin OAuth client id
      hosted-domain: ${TAZZZO_ADMIN_OIDC_HOSTED_DOMAIN:}        # company Workspace domain (exact `hd`)
      credential-label: ${TAZZZO_ADMIN_OIDC_CREDENTIAL_LABEL:}  # audit credential_id = oidc:google:<label>
  consumer:
    # LIST-CURSOR-1. Base64 of >= 32 random bytes; signs every product-list cursor. NO DEFAULT BY
    # DESIGN: the production value is generated at deployment setup (CEO decision), never checked
    # in or invented here. Missing or malformed => the LIST route answers 503 before any product
    # work. ROOT and CHILDREN do not need it. v1 rotation may invalidate outstanding cursors.
    cursor-hmac-key-b64: ${TAZZZO_CONSUMER_CURSOR_HMAC_KEY_B64:}
    # Trusted server-side callers (the Next.js storefront): a list of {name, secret}, NO DEFAULT and deliberately
    # not listed here -- set it from the secret store as TAZZZO_CONSUMER_TRUSTEDCALLERS_0_NAME (e.g. storefront,
    # [a-z][a-z_]{0,19}) and TAZZZO_CONSUMER_TRUSTEDCALLERS_0_SECRET (32..256 printable ASCII), plus the optional
    # TAZZZO_CONSUMER_TRUSTEDCALLERS_0_PREVIOUSSECRET while rotating (docs/ops/DEPLOYMENT.md). A request carrying
    # X-Tazzzo-Caller + a matching X-Tazzzo-Caller-Secret on a public /v1 read is charged to its own bucket
    # (tazzzo.consumer-rate-limit.caller) instead of the IP/installation buckets. A missing or wrong credential is
    # never refused: it is admitted exactly as an ordinary client (one WARN per minute per caller, never the secret).
  customer-auth:
    # PR-11A. Base64 of >= 32 random bytes; signs every customer access token. NO DEFAULT BY
    # DESIGN: the production value is a deployment secret (CEO decision), never checked in or
    # invented here. Missing or malformed => CustomerAccessTokenCodec is NOT READY and every
    # /v1/customer/** request fails closed with 401 -- there is no anonymous fallback.
    access-token-hmac-key-b64: ${TAZZZO_CUSTOMER_AUTH_ACCESS_TOKEN_HMAC_KEY_B64:}
    # PR-11C key rotation. Comma-separated list of PREVIOUS access-token signing keys,
    # VERIFICATION-ONLY -- new tokens are always signed with the key above. Empty by default. To
    # rotate: deploy the new key as access-token-hmac-key-b64 and the OLD key here; remove it once
    # every token issued under it has expired (bounded by the access-token TTL).
    previous-access-token-hmac-keys-b64: ${TAZZZO_CUSTOMER_AUTH_PREVIOUS_ACCESS_TOKEN_HMAC_KEYS_B64:}
    session:
      # PR-11C. Base64 of >= 32 random bytes; signs the refresh-token verifier. A SEPARATE secret
      # from BOTH the access-token key above and the OTP key below -- no key reuse across trust
      # domains. NO DEFAULT BY DESIGN. Missing/malformed => refresh-token issuance/verification is
      # NOT READY and session establishment/refresh fails closed with 503.
      refresh-token-hmac-key-b64: ${TAZZZO_CUSTOMER_SESSION_REFRESH_HMAC_KEY_B64:}
      # Short-lived access token, reusing PR-11A's CustomerAccessTokenCodec.
      access-token-ttl-seconds: ${TAZZZO_CUSTOMER_SESSION_ACCESS_TOKEN_TTL_SECONDS:900}
      # Session (and therefore max refresh) lifetime -- independent of access-token TTL.
      session-ttl-seconds: ${TAZZZO_CUSTOMER_SESSION_TTL_SECONDS:2592000}
    otp:
      # PR-11B. Base64 of >= 32 random bytes; a SEPARATE secret from the access-token key above —
      # it signs the keyed OTP verifier persisted instead of a plaintext code, and the keyed phone
      # rate-limit digest. NO DEFAULT BY DESIGN. Missing or malformed => OtpVerifierCodec is NOT
      # READY and every OTP request/verify call fails closed with 503.
      hmac-key-b64: ${TAZZZO_CUSTOMER_AUTH_OTP_HMAC_KEY_B64:}
      # Production policy target (mission-ratified): 5 minute validity, 30s resend cooldown, 5
      # verification attempts. Validated at startup (> 0 / >= 0) — see OtpAuthProperties.
      ttl-seconds: ${TAZZZO_OTP_TTL_SECONDS:300}
      resend-cooldown-seconds: ${TAZZZO_OTP_RESEND_COOLDOWN_SECONDS:30}
      max-attempts: ${TAZZZO_OTP_MAX_ATTEMPTS:5}
      # How long a successful-verification login grant remains consumable by PR-11C.
      grant-ttl-seconds: ${TAZZZO_OTP_GRANT_TTL_SECONDS:300}
      # Durability hardening: how long a PENDING_DELIVERY challenge may hold the "delivering" slot
      # before it is considered stale (e.g. the process crashed before recording a provider
      # outcome). Independent of ttl-seconds — the OTP's own validity window starts at CONFIRMED
      # delivery, not at challenge creation.
      delivery-timeout-seconds: ${TAZZZO_OTP_DELIVERY_TIMEOUT_SECONDS:60}
      # NO DEFAULT PRODUCTION PROVIDER BY DESIGN. Unset => no OtpDeliveryProvider bean => the
      # request endpoint fails closed with 503 rather than silently discarding an OTP. LOGGING
      # wires the dev-only LoggingOtpDeliveryProvider (never logs the plaintext OTP). A real
      # SMS/WhatsApp vendor integration is explicitly out of scope for PR-11B.
      provider-mode: ${TAZZZO_OTP_PROVIDER_MODE:}
      # Rate-limit buckets share the SAME RateLimitStore the consumer surface uses (no separate
      # Redis wiring). No production default. Left unconfigured, the OTP endpoints fail closed
      # with 503 at request time (never "unlimited") — this is a REQUEST-TIME, not startup-time,
      # fail-closed state, because a RateLimitStore may legitimately be wired for the consumer
      # surface alone without ever intending to serve OTP traffic.
      request-ip:
        capacity: ${TAZZZO_OTP_REQUEST_IP_CAPACITY:0}
        refill-per-second: ${TAZZZO_OTP_REQUEST_IP_REFILL:0}
      request-phone:
        capacity: ${TAZZZO_OTP_REQUEST_PHONE_CAPACITY:0}
        refill-per-second: ${TAZZZO_OTP_REQUEST_PHONE_REFILL:0}
      verify-ip:
        capacity: ${TAZZZO_OTP_VERIFY_IP_CAPACITY:0}
        refill-per-second: ${TAZZZO_OTP_VERIFY_IP_REFILL:0}
      verify-challenge:
        capacity: ${TAZZZO_OTP_VERIFY_CHALLENGE_CAPACITY:0}
        refill-per-second: ${TAZZZO_OTP_VERIFY_CHALLENGE_REFILL:0}
  membership:
    # PR-16A-1: the immutable, version-explicit launch plan source. Loaded ONCE and validated at
    # startup (a bad entry fails the application start). A plan version's commercial terms never
    # change -- a new price is a NEW version, never an edit (a golden test pins v1). effective-from /
    # effective-until gate NEW grants only. Price is int64 paise, INR.
    plans:
      - plan-id: TAZZZO_PLUS_MONTHLY
        version: 1
        price-paise: 9900
        currency: INR
        period-months: 1
        effective-from: "2026-01-01T00:00:00Z"
  # Benefits foundation: the immutable, version-explicit benefit rule source, keyed by the EXACT Membership
  # (plan-id, plan-version). NO production rule is configured: no launch percentage or threshold is ratified, so
  # this property is deliberately ABSENT (absent and an empty list both mean "no rule", and an entitled customer
  # receives no discount). Every rule is validated at application start: plan-id, plan-version, a strictly positive
  # minimum-subtotal-paise (inclusive threshold), currency INR, and discount-bps in 1..10000 (10000 = 100%) such
  # that floor(minimum * bps / 10000) >= 1 paise.
  consumer-rate-limit:
    # NO PRODUCTION DEFAULT BY DESIGN (Q5-c). Unset or unrecognised is a STARTUP FAILURE, because a
    # permissive default is worse than none: it looks like a decision. DISABLED is an intentional
    # fail-closed state (no limiter is built and the consumer surface must not be exposed), NOT an
    # in-memory limiter. REDIS requires complete Redis, bucket and trusted-proxy configuration.
    mode: ${TAZZZO_CONSUMER_RATE_LIMIT_MODE:}
    # The limiter OWNS its endpoint. Not spring.data.redis.* — production admission control must
    # not depend on whatever connection defaults an autoconfiguration supplies, and must not be
    # silently repointed by an unrelated future Redis feature. REDIS mode refuses to start without
    # it. Q5-REDIS-1: ONE WRITER SHARD, cluster mode DISABLED (replication/Multi-AZ is fine).
    redis-url: ${TAZZZO_RATE_LIMIT_REDIS_URL:}
    # Q5-IP-1. Behind a proxy this MUST list it, or the resolver treats the proxy as the client and
    # every consumer lands in one bucket. Empty means "trust no proxy" and REDIS mode refuses it.
    trusted-proxy-cidrs: ${TAZZZO_TRUSTED_PROXY_CIDRS:}
    # Capacities and refill rates are MANDATORY production configuration derived from load
    # measurement (Q5-c). They are deliberately not defaulted here; test profiles carry fixture
    # values, and those are not production recommendations.
    ip:
      capacity: ${TAZZZO_RATE_LIMIT_IP_CAPACITY:0}
      refill-per-second: ${TAZZZO_RATE_LIMIT_IP_REFILL:0}
    installation:
      capacity: ${TAZZZO_RATE_LIMIT_INSTALL_CAPACITY:0}
      refill-per-second: ${TAZZZO_RATE_LIMIT_INSTALL_REFILL:0}
    # The ONE bucket a trusted caller (tazzzo.consumer.trusted-callers) is charged to: it is the whole storefront's
    # allowance, not a visitor's (per-visitor limits are the storefront's job). Unlike ip/installation it has a
    # documented STARTING value -- 20000 units burst, 2000 units/s sustained (about 68 uncached root listings at the
    # seed tree's 294 units each, or 80 page-size-24 lists a second) -- because it only applies once a trusted caller
    # is configured. It is not load-tested: tune it with the IP budgets. Capacity must stay >= the most expensive
    # single request (a root listing costs 1 + visible verticals), or that request answers 503.
    caller:
      capacity: ${TAZZZO_RATE_LIMIT_CALLER_CAPACITY:20000}
      refill-per-second: ${TAZZZO_RATE_LIMIT_CALLER_REFILL:2000}
server:
  # Platform baseline. The application NEVER rewrites scheme/host/port/client address from X-Forwarded-* headers:
  # the only consumer of X-Forwarded-For is the rate limiter's ClientIpResolver, which honours it solely from the
  # configured trusted-proxy CIDRs (tazzzo.consumer-rate-limit.trusted-proxy-cidrs) and fails closed otherwise.
  # No absolute URL is ever built from a request, so nothing needs the proxy's scheme.
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    # Explicit (it is also the default): more query/form parameters than this is refused 400 by MalformedQueryFilter.
    max-parameter-count: 1000
    # Stop draining a body the application already refused with 413 (see tazzzo.http.max-request-body-bytes).
    max-swallow-size: ${TAZZZO_HTTP_MAX_BODY_BYTES:65536}
  # Stop accepting new requests on SIGTERM and let in-flight ones finish (bounded by
  # spring.lifecycle.timeout-per-shutdown-phase), so a rolling deploy never cuts a checkout mid-transaction.
  shutdown: graceful
tazzzo.http:
  # Every request body on every surface is bounded (413 PAYLOAD_TOO_LARGE); the largest legitimate body in this API
  # is a few KiB. Bounds: 1 KiB .. 16 MiB (startup failure outside them).
  max-request-body-bytes: ${TAZZZO_HTTP_MAX_BODY_BYTES:65536}
  # Admin bulk import (/api/v1/admin/imports/**): up to 500 rows per file. Bounds: max-request-body-bytes .. 16 MiB.
  bulk-import-max-request-body-bytes: ${TAZZZO_HTTP_BULK_IMPORT_MAX_BODY_BYTES:2097152}
  cors:
    # CORS is OFF unless exact origins are listed (comma-separated), e.g. https://cms.tazzzo.com. Browser-only concern:
    # the mobile app and a server-side BFF are not subject to it. No wildcard; https required (http only for localhost).
    allowed-origins: ${TAZZZO_HTTP_CORS_ALLOWED_ORIGINS:}
    max-age-seconds: 600
tazzzo.health:
  # /health/live never consults a dependency (container health check). /health/ready (load-balancer target check)
  # requires the serving gate to be OPEN and, by default, a bounded MongoDB ping; the rate-limiter store is reported
  # and only fails readiness when require-rate-limiter=true (a shared-store outage would otherwise take every target
  # out at once and trigger task replacement, which cannot fix the store).
  readiness:
    require-mongo: ${TAZZZO_HEALTH_REQUIRE_MONGO:true}
    require-rate-limiter: ${TAZZZO_HEALTH_REQUIRE_RATE_LIMITER:false}
management:
  observations:
    enable:
      http:
        server:
          # CONSUMER-OBS-2: Spring's automatic http.server.requests observation tags every request
          # with the URI template and exception class -- a parallel telemetry vocabulary that
          # Q5-OBS-1 forbids. The explicit route enum (tazzzo.catalog.consumer.requests /
          # request.duration) IS the HTTP measurement contract. Proved by the registry, not here.
          requests: false
  endpoints:
    web:
      # Q5-OBS-1: Actuator is on the classpath for Micrometer ONLY. No actuator endpoint is
      # served over HTTP; /actuator/** is UNKNOWN to SurfaceClassifier and refused by the auth
      # filter before routing, and this makes it structural as well -- nothing is registered.
      # The telemetry exporter is a deployment decision, not chosen here.
      exposure:
        include: ""
