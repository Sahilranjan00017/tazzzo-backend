        requestId:
          type: string
        freshness:
          type: string
          enum:
          - FRESH
          - REVALIDATE
          description: 'Cart age band: FRESH under 24 h since the last mutation; REVALIDATE from 24 h through 7 days (review prices, PRICE_CHANGED lines). An empty cart is FRESH.'
    CustomerCartItem:
      type: object
      required:
      - skuId
      - quantity
