openapi: 3.0.3
info:
  title: Tazzzo Commerce Read API
  version: "1.0.0-draft"
  description: >
    Production customer-facing commerce READ contract (Phase 3.1 freeze).
    This document is a FROZEN CONTRACT ONLY — it is NOT yet implemented.
    The existing internal/consumer API under `/catalog/v1` and `/api/v1`
    (see docs/openapi.json) is unchanged and documented separately.
    All monetary amounts are integer paise (int64), currency INR.
servers:
  - url: https://api.tazzzo.com
    description: Production gateway (not yet provisioned)
tags:
  - name: commerce-read
    description: Composed, consumer-ready browse contract (ADR-001, ADR-003.1).
  - name: customer-auth-otp
    description: >
      PR-11B — OTP challenge lifecycle only. Public (no bearer token required or honoured).
      Does NOT create a customer, a session, or issue any access/refresh token — a successful
      verify proves phone possession and produces a one-time internal login grant that PR-11C
      consumes to create a session.
  - name: customer-auth-session
    description: >
      PR-11C — completes customer authentication: OTP verified grant -> customer resolution/
      creation -> session -> access/refresh tokens -> refresh rotation -> logout. Session
      establishment and refresh are PUBLIC (no bearer required — that is how a client obtains one);
      logout REQUIRES a valid customer access token. Does NOT cover customer profile, addresses,
      cart, checkout, or orders — those are future phases.
  - name: customer-profile
    description: >
      PR-12A — authenticated read/update of a customer's OWN profile (displayName, email only).
      Both endpoints REQUIRE a valid customer access token; customerId always comes from the
      token, never from the request. Optimistic concurrency via ETag/If-Match. Email here is
      OPTIONAL, UNVERIFIED profile data — never an authentication identity, never used to log in.
      Does NOT cover address, cart, checkout, order, payment, or any other customer data — those
      are future phases.
  - name: customer-address
    description: >
      PR-12B — authenticated CRUD of a customer's OWN saved delivery addresses, plus dynamic
      serviceability binding. All endpoints REQUIRE a valid customer access token; customerId
      always comes from the token, never from the request. Optimistic concurrency via
      ETag/If-Match, the SAME pattern as customer-profile. Serviceability is evaluated FRESH on
      every read/response from the existing serviceability domain — it is never persisted as
      address state, and saving an address never requires it to currently be serviceable.
      The ETag `"address-<version>"` is the address-CONTENT concurrency token for PATCH/DELETE
      If-Match — not a complete version of the customer's default-preference state (`isDefault` can
      change without the address version changing; responses are no-store).
      recipientPhone is delivery-contact information only, never an authentication identity.
      fulfillmentLocationId is internal and never exposed. serviceAreaId/serviceAreaVersion are public
      in the existing /v1/serviceability contract, but this address projection intentionally omits them
      (it exposes only the narrower `serviceable`). Does NOT cover cart, checkout, order,
      or payment — those are future phases.
paths:
  /v1/categories:
    get:
      tags: [commerce-read]
      operationId: getCategories
      summary: Flat list of consumer-visible super-categories (ROOT).
      parameters:
        - $ref: '#/components/parameters/Release'
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/categories/{id}/children:
    get:
      tags: [commerce-read]
      operationId: getCategoryChildren
      summary: Immediate consumer-visible children of a taxonomy node.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Release'
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK (a visible vertical returns empty items)
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/categories/{id}/products:
    get:
      tags: [commerce-read]
      operationId: listProductsInCategory
      summary: >
        Cursor-paginated ProductCard list under a node, enriched with
        location-specific stock/serviceability when a location is supplied.
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Release'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Pin'
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPrivate' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedProductResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/products/{id}:
    get:
      tags: [commerce-read]
      operationId: getProductDetail
      summary: Full ProductDetail, location-enriched when a location is supplied.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Release'
        - $ref: '#/components/parameters/Pin'
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/serviceability:
    get:
      tags: [commerce-read]
      operationId: getServiceability
      summary: Resolve a customer location to a serviceable area + ETA.
      parameters:
        - $ref: '#/components/parameters/Pin'
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceabilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/auth/otp/request:
    post:
      tags: [customer-auth-otp]
      operationId: requestOtp
      summary: >
        Request (or idempotently re-arm, within the resend cooldown) an OTP challenge for an
        India phone number. The response is IDENTICAL regardless of whether the phone belongs to
        an existing customer — this endpoint queries no customer data at all.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequestRequest' }
      responses:
        '202':
          description: Challenge created or re-armed. Never contains the OTP or the phone.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestResponse' }
        '400': { $ref: '#/components/responses/OtpBadRequest' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '503': { $ref: '#/components/responses/OtpUnavailable' }
  /v1/auth/otp/verify:
    post:
      tags: [customer-auth-otp]
      operationId: verifyOtp
      summary: >
        Verify a 6-digit OTP against an active challenge. Success produces an opaque, one-time
        internal login grant id — NOT a customer access or refresh token, and no session or
        customer is created by this call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: OTP verified. grantId is opaque and carries no phone/PII.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400': { $ref: '#/components/responses/OtpBadRequest' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '503': { $ref: '#/components/responses/OtpUnavailable' }
  /v1/auth/session:
    post:
      tags: [customer-auth-session]
      operationId: establishSession
      summary: >
        Consume an OTP verified grant to resolve-or-create the customer, create a login session,
        and issue an access token + refresh token. PUBLIC — this is how a client obtains its
        first token. sessionId and the phone number are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionEstablishRequest' }
      responses:
        '200':
          description: Session established.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEstablishResponse' }
        '400': { $ref: '#/components/responses/SessionBadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthenticated' }
        '503': { $ref: '#/components/responses/SessionUnavailable' }
  /v1/auth/refresh:
    post:
      tags: [customer-auth-session]
      operationId: refreshSession
      summary: >
        Rotate a refresh token for a new access token + a NEW refresh token. The presented refresh
        token is invalidated by this call, whether or not it is ever used again — atomic rotation
        (a race between two callers presenting the SAME token lets exactly one win). PUBLIC.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated. A brand-new refresh token is always returned.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '400': { $ref: '#/components/responses/SessionBadRequest' }
        '401': { $ref: '#/components/responses/SessionUnauthenticated' }
        '503': { $ref: '#/components/responses/SessionUnavailable' }
  /v1/auth/logout:
    post:
      tags: [customer-auth-session]
      operationId: logout
      summary: >
        Revoke the CURRENT session (identified by the presented access token). REQUIRES a valid
        customer access token — despite living under the public /v1/auth/** namespace, this
        endpoint performs its own explicit bearer authentication. Repeated logout is safe. Does
        not delete the customer. No logout-all in this phase.
      security:
        - customerBearerAuth: []
      responses:
        '204':
          description: Session revoked (or was already revoked — never distinguished).
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        '401': { $ref: '#/components/responses/SessionUnauthenticated' }
  /v1/customer/profile:
    get:
      tags: [customer-profile]
      operationId: getCustomerProfile
      summary: >
        The caller's OWN profile. A customer who has never set one gets a deterministic default
        projection (displayName=null, email=null) at version 0 — no profile document is created by
        a GET. customerId always comes from the access token, never a path/query parameter.
      security:
        - customerBearerAuth: []
      responses:
        '200':
          description: OK (a default, never-persisted projection if no profile exists yet).
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag:
              description: 'Opaque optimistic-concurrency tag, shape "profile-<version>". "profile-0" means no profile has been created yet.'
              schema: { type: string, example: '"profile-0"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfileResponse' }
        '401': { $ref: '#/components/responses/ProfileUnauthenticated' }
        '503': { $ref: '#/components/responses/ProfileUnavailable' }
    patch:
      tags: [customer-profile]
      operationId: patchCustomerProfile
      summary: >
        Partial update of the caller's OWN profile. Requires If-Match (optimistic concurrency) —
        a missing header is 428, a stale version is 412. Only fields PRESENT in the body are
        changed; a field explicit-null CLEARS it; a field entirely omitted is left untouched. An
        empty body (or a body with neither displayName nor email) is 400. Lazily creates the
        profile on first PATCH (If-Match: "profile-0" against a customer with no profile yet).
      security:
        - customerBearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, maxLength: 40, example: '"profile-0"' }
          description: The ETag last observed for this profile ("profile-0" if none was ever read).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerProfilePatchRequest' }
      responses:
        '200':
          description: Updated (or lazily created). Returns the full current profile projection.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag:
              description: The NEW version tag after this mutation.
              schema: { type: string, example: '"profile-1"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfileResponse' }
        '400': { $ref: '#/components/responses/ProfileBadRequest' }
        '401': { $ref: '#/components/responses/ProfileUnauthenticated' }
        '412': { $ref: '#/components/responses/ProfilePreconditionFailed' }
        '428': { $ref: '#/components/responses/ProfilePreconditionRequired' }
        '503': { $ref: '#/components/responses/ProfileUnavailable' }
  /v1/customer/addresses:
    get:
      tags: [customer-address]
      operationId: listCustomerAddresses
      summary: >
        The caller's OWN saved addresses only. Ordered default-first, then most-recently-updated.
        No pagination (the saved-address limit is small by design).
      security:
        - customerBearerAuth: []
      responses:
        '200':
          description: OK. Each item's `serviceability` is evaluated fresh, not stored state.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddressListResponse' }
        '401': { $ref: '#/components/responses/AddressUnauthenticated' }
        '503': { $ref: '#/components/responses/AddressUnavailable' }
    post:
      tags: [customer-address]
      operationId: createCustomerAddress
      summary: >
        Save a new address for the caller. The FIRST saved address automatically becomes the
        default; subsequent addresses do not. Bounded by a per-customer saved-address limit
        (409 ADDRESS_LIMIT_REACHED once reached). Saving succeeds even if the address is CURRENTLY
        unserviceable — address validity is independent of commerce eligibility, which is
        re-evaluated dynamically on every read and again at future Checkout.
      security:
        - customerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAddressCreateRequest' }
      responses:
        '201':
          description: Created, at version 1.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { description: 'Shape "address-1".', schema: { type: string, example: '"address-1"' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddressResponse' }
        '400': { $ref: '#/components/responses/AddressBadRequest' }
        '401': { $ref: '#/components/responses/AddressUnauthenticated' }
        '409': { $ref: '#/components/responses/AddressLimitReached' }
        '503': { $ref: '#/components/responses/AddressUnavailable' }
  /v1/customer/addresses/{addressId}:
    get:
      tags: [customer-address]
      operationId: getCustomerAddress
      summary: >
        The caller's OWN address. An unknown address id AND another customer's address return the
        IDENTICAL 404 — no ownership enumeration.
      security:
        - customerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AddressIdParam'
      responses:
        '200':
          description: OK.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { description: 'Shape "address-<version>".', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddressResponse' }
        '401': { $ref: '#/components/responses/AddressUnauthenticated' }
        '404': { $ref: '#/components/responses/AddressNotFound' }
        '503': { $ref: '#/components/responses/AddressUnavailable' }
    patch:
      tags: [customer-address]
      operationId: patchCustomerAddress
      summary: >
        Partial update of the caller's OWN address. Requires If-Match. Only fields PRESENT in the
        body change; addressLine2/landmark may be explicit-null cleared; latitude/longitude are
        ALWAYS a pair (both present or both absent in the patch, never just one); every other
        field is required and can never be set null. Cannot change addressId, customerId, version,
        createdAt, updatedAt, or isDefault directly (use the dedicated default endpoint).
      security:
        - customerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AddressIdParam'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, maxLength: 40, example: '"address-1"' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAddressPatchRequest' }
      responses:
        '200':
          description: Updated. Returns the full current address projection with a new ETag.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { description: 'The NEW version tag.', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddressResponse' }
        '400': { $ref: '#/components/responses/AddressBadRequest' }
        '401': { $ref: '#/components/responses/AddressUnauthenticated' }
        '404': { $ref: '#/components/responses/AddressNotFound' }
        '412': { $ref: '#/components/responses/AddressPreconditionFailed' }
        '428': { $ref: '#/components/responses/AddressPreconditionRequired' }
        '503': { $ref: '#/components/responses/AddressUnavailable' }
    delete:
      tags: [customer-address]
      operationId: deleteCustomerAddress
      summary: >
        Delete the caller's OWN address. Requires If-Match (prevents deleting a version the client
        never actually read). Deleting the current default deterministically promotes the
        most-recently-updated remaining address (or leaves zero default if none remain). Repeated
        delete after success is 404 (simple, idempotent-in-effect).
      security:
        - customerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AddressIdParam'
        - name: If-Match
          in: header
          required: true
          schema: { type: string, maxLength: 40, example: '"address-1"' }
      responses:
        '204':
          description: Deleted.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        '401': { $ref: '#/components/responses/AddressUnauthenticated' }
        '404': { $ref: '#/components/responses/AddressNotFound' }
        '412': { $ref: '#/components/responses/AddressPreconditionFailed' }
        '428': { $ref: '#/components/responses/AddressPreconditionRequired' }
        '503': { $ref: '#/components/responses/AddressUnavailable' }
  /v1/customer/addresses/{addressId}/default:
    put:
      tags: [customer-address]
      operationId: setDefaultCustomerAddress
      summary: >
        Atomically make this the caller's default address, clearing any prior default. Default is
        a customer PREFERENCE, independent of serviceability — it is never changed automatically
        because a location becomes unserviceable.
      security:
        - customerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AddressIdParam'
      responses:
        '200':
          description: OK. Returns the full current address projection (now the default).
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            ETag: { description: 'Shape "address-<version>".', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAddressResponse' }
        '401': { $ref: '#/components/responses/AddressUnauthenticated' }
        '404': { $ref: '#/components/responses/AddressNotFound' }
        '503': { $ref: '#/components/responses/AddressUnavailable' }
components:
  parameters:
    AddressIdParam:
      name: addressId
      in: path
      required: true
      schema: { type: string, pattern: '^ADDR_[A-Za-z0-9_-]{6,64}$' }
    Release:
      name: release
      in: query
      required: false
      schema: { type: string }
      description: Taxonomy release id; omitted resolves the current pointer once.
    NodeId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^TZ[SCGV]-[0-9]{6}$' }
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^TZP-[0-9]+$' }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque signed cursor. Clients MUST NOT parse it.
    Pin:
      name: pin
      in: query
      required: false
      schema: { type: string, pattern: '^[1-9][0-9]{5}$' }
      description: 6-digit Indian PIN code (launch location mechanism).
    Lat:
      name: lat
      in: query
      required: false
      schema: { type: number }
      description: Reserved for future lat/lng resolution.
    Lng:
      name: lng
      in: query
      required: false
      schema: { type: number }
      description: Reserved for future lat/lng resolution.
    InstallationId:
      name: X-Tazzzo-Installation-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9\-_.:]+$' }
      description: Optional opaque rate-limit dimension. Never identity/authz.
  headers:
    ETag:
      description: Entity tag for conditional GET on stable/global responses.
      schema: { type: string }
    CacheControl:
      description: Cacheable (global, release-keyed) response.
      schema: { type: string, example: "public, max-age=300, stale-while-revalidate=60" }
    CacheControlPrivate:
      description: Location-enriched response; never shared across locations.
      schema: { type: string, example: "private, max-age=15" }
    CacheControlNoStore:
      description: Per-request auth state; never cacheable by any intermediary.
      schema: { type: string, example: "no-store" }
  schemas:
    Node:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    NodeListResponse:
      type: object
      required: [resolvedReleaseId, items, requestId]
      properties:
        resolvedReleaseId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        requestId: { type: string }
    StockState:
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK, UNKNOWN]
    ProductImage:
      type: object
      required: [url, role, order]
      properties:
        url: { type: string, format: uri, description: Approved CDN host only. }
        role: { type: string, enum: [PRIMARY, GALLERY] }
        order: { type: integer, minimum: 0 }
        alt: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
    ProductVariant:
      type: object
      required: [variantId, skuId]
      properties:
        variantId: { type: string }
        skuId: { type: string }
        packSize: { type: string, nullable: true }
        unit: { type: string, nullable: true }
    ProductAttribute:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        value: {}
        unit: { type: string, nullable: true }
    LegalInformation:
      type: object
      properties:
        manufacturer: { type: string, nullable: true }
        countryOfOrigin: { type: string, nullable: true }
        netQuantity: { type: string, nullable: true }
        fssai: { type: string, nullable: true }
        importer: { type: string, nullable: true }
    ServiceAreaSummary:
      type: object
      required: [serviceable]
      properties:
        serviceAreaId: { type: string, nullable: true }
        serviceable: { type: boolean }
    ServiceabilityResponse:
      type: object
      required: [serviceable, requestId]
      properties:
        serviceable: { type: boolean }
        serviceAreaId: { type: string, nullable: true }
        serviceAreaVersion: { type: integer, format: int64, nullable: true }
        etaMinutesMin: { type: integer, nullable: true }
        etaMinutesMax: { type: integer, nullable: true }
        requestId: { type: string }
    ProductCard:
      type: object
      description: >
        Public composed card = stable base fields + runtime location enrichment.
        Amounts are integer paise (int64). Location fields are null/UNKNOWN when
        no location is supplied.
      required: [skuId, productId, name, stockState, maxOrderQuantity, minimumOrderQuantity, buyable]
      properties:
        skuId: { type: string }
        productId: { type: string }
        name: { type: string }
        brandCode: { type: string, nullable: true }
        brandName: { type: string, nullable: true }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        packSize: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        sellingPricePaise: { type: integer, format: int64, nullable: true, minimum: 0 }
        mrpPaise: { type: integer, format: int64, nullable: true, minimum: 0 }
        discountPercent: { type: integer, nullable: true, minimum: 0, maximum: 99 }
        discountAmountPaise: { type: integer, format: int64, nullable: true, minimum: 0 }
        offerSummary: { type: string, nullable: true }
        categoryId: { type: string, nullable: true }
        verticalId: { type: string, nullable: true }
        badges:
          type: array
          nullable: true
          items: { type: string }
        rating: { type: integer, nullable: true, description: "rating x10 (e.g. 45 = 4.5); integer to avoid floats" }
        ratingCount: { type: integer, nullable: true }
        sponsored: { type: boolean, default: false }
        stockState: { $ref: '#/components/schemas/StockState' }
        lowStockRemaining: { type: integer, nullable: true }
        maxOrderQuantity: { type: integer, minimum: 0 }
        minimumOrderQuantity: { type: integer, minimum: 1, default: 1 }
        serviceable: { type: boolean, nullable: true }
        etaMinutesMin: { type: integer, nullable: true }
        etaMinutesMax: { type: integer, nullable: true }
        buyable: { type: boolean, description: "server-derived: priced AND in stock AND serviceable AND active" }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [resolvedReleaseId, requestId]
          properties:
            description: { type: string, nullable: true }
            highlights:
              type: array
              nullable: true
              items: { type: string }
            gallery:
              type: array
              items: { $ref: '#/components/schemas/ProductImage' }
            attributes:
              type: array
              items: { $ref: '#/components/schemas/ProductAttribute' }
            variants:
              type: array
              items: { $ref: '#/components/schemas/ProductVariant' }
            legal: { $ref: '#/components/schemas/LegalInformation' }
            serviceability: { $ref: '#/components/schemas/ServiceabilityResponse' }
            resolvedReleaseId: { type: string }
            requestId: { type: string }
    PagedProductResponse:
      type: object
      required: [resolvedReleaseId, items, hasMore, requestId]
      properties:
        resolvedReleaseId: { type: string }
        serviceArea: { $ref: '#/components/schemas/ServiceAreaSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductCard' }
        nextCursor: { type: string, nullable: true, description: Omitted at end of list. }
        hasMore: { type: boolean }
        requestId: { type: string }
    OtpRequestRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: >
            India phone number. E.164 (+91XXXXXXXXXX) preferred; bare 10-digit or leading-zero
            domestic forms are also normalized. No other country is accepted.
          example: "+919876543210"
    OtpRequestResponse:
      type: object
      required: [challengeId, expiresInSeconds, resendAfterSeconds, requestId]
      properties:
        challengeId: { type: string, pattern: '^OTP_[A-Za-z0-9_-]+$' }
        expiresInSeconds: { type: integer, format: int64 }
        resendAfterSeconds: { type: integer, format: int64 }
        requestId: { type: string }
    OtpVerifyRequest:
      type: object
      required: [challengeId, otp]
      properties:
        challengeId: { type: string, pattern: '^OTP_[A-Za-z0-9_-]+$' }
        otp: { type: string, pattern: '^[0-9]{6}$' }
    OtpVerifyResponse:
      type: object
      required: [challengeId, verified, grantId, requestId]
      properties:
        challengeId: { type: string }
        verified: { type: boolean }
        grantId:
          type: string
          pattern: '^GRANT_[A-Za-z0-9_-]+$'
          description: >
            Opaque one-time login grant. NOT an access or refresh token; carries no phone/PII.
            A future phase atomically consumes it to create a customer session.
        requestId: { type: string }
    OtpErrorEnvelope:
      type: object
      description: >
        Independent of ErrorEnvelope (the frozen commerce-read contract) — a deliberately small,
        stable OTP-specific vocabulary that never distinguishes "unknown challenge" from "wrong
        code" from "locked" from "superseded" (all OTP_INVALID).
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [OTP_INVALID_REQUEST, OTP_INVALID, OTP_EXPIRED, OTP_RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL]
        message: { type: string, description: "Safe, generic. No internals, no OTP, no phone." }
        requestId: { type: string }
        retryAfterSeconds: { type: integer, nullable: true }
    ErrorEnvelope:
      type: object
      required: [code, message, requestId, retryable]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, INVALID_CURSOR, NOT_FOUND, RATE_LIMITED, SERVICE_UNAVAILABLE, INTERNAL]
        message: { type: string, description: "Safe, generic. No internals." }
        requestId: { type: string }
        retryable: { type: boolean }
        retryAfterSeconds: { type: integer, nullable: true }
        details: { type: object, nullable: true, description: Only when safe. }
    SessionEstablishRequest:
      type: object
      required: [grantId]
      properties:
        grantId: { type: string, pattern: '^GRANT_[A-Za-z0-9_-]+$' }
    SessionEstablishResponse:
      type: object
      description: >
        sessionId and the phone number are DELIBERATELY OMITTED — the client never needs either
        directly; the access token carries the session internally and the refresh token embeds it
        as an opaque routing prefix.
      required: [customerId, accessToken, accessTokenExpiresIn, refreshToken, requestId]
      properties:
        customerId: { type: string, pattern: '^CUS_[A-Za-z0-9_-]+$' }
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer, format: int64, description: Seconds. }
        refreshToken: { type: string }
        requestId: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    RefreshResponse:
      type: object
      description: A brand-new refresh token every time — the presented one is rotated away and
        never usable again, whether or not this response is ever received by the client.
      required: [accessToken, accessTokenExpiresIn, refreshToken, requestId]
      properties:
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer, format: int64, description: Seconds. }
        refreshToken: { type: string }
        requestId: { type: string }
    SessionErrorEnvelope:
      type: object
      description: >
        Independent of ErrorEnvelope/OtpErrorEnvelope/CustomerAuthError (different trust domains).
        INVALID grant/refresh-token states — unknown, consumed, expired, wrong purpose, digest
        mismatch, revoked, rotated-away — all collapse to the SAME UNAUTHENTICATED outcome.
      required: [code, message, requestId]
      properties:
        code: { type: string, enum: [INVALID_REQUEST, UNAUTHENTICATED, SERVICE_UNAVAILABLE, INTERNAL] }
        message: { type: string, description: "Safe, generic. No internals, no tokens, no phone." }
        requestId: { type: string }
    CustomerProfileResponse:
      type: object
      description: >
        Deliberately excludes phoneNormalized (auth identity data) and any Mongo internals beyond
        the public version counter. displayName/email are nullable — null means never set (or
        explicitly cleared). email is UNVERIFIED profile data only; this document never claims
        emailVerified=true because there is no verification step in this PR.
      required: [customerId, version, requestId]
      properties:
        customerId: { type: string, pattern: '^CUS_[A-Za-z0-9_-]+$' }
        displayName: { type: string, nullable: true, maxLength: 80 }
        email: { type: string, nullable: true, maxLength: 254 }
        version: { type: integer, format: int64, minimum: 0 }
        requestId: { type: string }
    CustomerProfilePatchRequest:
      type: object
      description: >
        True partial-update semantics: a field OMITTED from the body is left untouched; a field
        PRESENT with JSON null CLEARS it; a field PRESENT with a string sets it. A body with
        neither key present (including {}) is rejected as 400 INVALID_REQUEST — there is no
        silent no-op PATCH.
      properties:
        displayName: { type: string, nullable: true, maxLength: 80 }
        email: { type: string, nullable: true, maxLength: 254 }
    CustomerProfileErrorEnvelope:
      type: object
      description: >
        Covers BOTH failure sources on this path: the pre-existing CustomerAuthFilter boundary
        (UNAUTHENTICATED/SERVICE_UNAVAILABLE — an invalid/missing/revoked credential, or a
        signing-key/session-authority readiness failure) and this domain's own controller
        (INVALID_REQUEST/PRECONDITION_REQUIRED/PRECONDITION_FAILED/SERVICE_UNAVAILABLE/INTERNAL —
        a request-shape problem, a missing/stale If-Match, or a profile-store outage). Same flat
        shape either way; a client never needs to know which layer rejected it.
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, UNAUTHENTICATED, PRECONDITION_REQUIRED, PRECONDITION_FAILED,
                 SERVICE_UNAVAILABLE, INTERNAL]
        message: { type: string, description: "Safe, generic. No internals, no PII." }
        requestId: { type: string }
    CustomerAddressServiceability:
      type: object
      description: >
        Evaluated FRESH from the existing serviceability domain on every read/response — never
        persisted address state. `serviceable=null` means UNKNOWN (the serviceability dependency
        could not currently be evaluated), deliberately distinct from `false` (a definite answer:
        this location is outside coverage today). Saving an address never requires it to be
        serviceable now.
      properties:
        serviceable: { type: boolean, nullable: true }
    CustomerAddressResponse:
      type: object
      description: >
        NEVER exposes fulfillmentLocationId (internal), warehouseId, or any Mongo internal. It also
        intentionally omits serviceAreaId/serviceAreaVersion (public in /v1/serviceability) — the
        address projection is a narrower `serviceable`-only view.
        recipientPhone is DELIVERY CONTACT information only — never an authentication identity,
        never used to log in, may differ from the customer's login phone.
      required: [addressId, label, recipientName, recipientPhone, addressLine1, city, state,
                 postalCode, isDefault, version, serviceability, requestId]
      properties:
        addressId: { type: string, pattern: '^ADDR_[A-Za-z0-9_-]+$' }
        label: { type: string, enum: [HOME, WORK, OTHER] }
        recipientName: { type: string, maxLength: 80 }
        recipientPhone: { type: string, description: "Canonical +91 E.164. Delivery contact only." }
        addressLine1: { type: string, maxLength: 160 }
        addressLine2: { type: string, nullable: true, maxLength: 160 }
        landmark: { type: string, nullable: true, maxLength: 120 }
        city: { type: string, maxLength: 80 }
        state: { type: string, maxLength: 80 }
        postalCode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        latitude: { type: number, format: double, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, nullable: true, minimum: -180, maximum: 180 }
        isDefault: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        serviceability: { $ref: '#/components/schemas/CustomerAddressServiceability' }
        requestId: { type: string }
    CustomerAddressListResponse:
      type: object
      required: [items, requestId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerAddressResponse' }
        requestId: { type: string }
    CustomerAddressCreateRequest:
      type: object
      description: >
        No client-supplied addressId/customerId/version/createdAt/updatedAt/fulfillmentLocationId/
        serviceAreaId — none of those fields exist on this request at all. latitude/longitude are a
        PAIR: both present and valid, or both omitted; exactly one supplied is 400.
      required: [label, recipientName, recipientPhone, addressLine1, city, state, postalCode]
      properties:
        label: { type: string, enum: [HOME, WORK, OTHER] }
        recipientName: { type: string, maxLength: 80 }
        recipientPhone: { type: string }
        addressLine1: { type: string, maxLength: 160 }
        addressLine2: { type: string, nullable: true, maxLength: 160 }
        landmark: { type: string, nullable: true, maxLength: 120 }
        city: { type: string, maxLength: 80 }
        state: { type: string, maxLength: 80 }
        postalCode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
    CustomerAddressPatchRequest:
      type: object
      description: >
        True partial-update semantics: a field OMITTED is left untouched; addressLine2/landmark
        PRESENT with JSON null CLEAR it; every other field is required and can never be set null.
        latitude/longitude are a pair -- both keys present (each may be null to clear both) or both
        omitted; exactly one key present is 400. Cannot change addressId/customerId/version/
        createdAt/updatedAt/isDefault (use PUT .../default for the last one).
      properties:
        label: { type: string, enum: [HOME, WORK, OTHER] }
        recipientName: { type: string, maxLength: 80 }
        recipientPhone: { type: string }
        addressLine1: { type: string, maxLength: 160 }
        addressLine2: { type: string, nullable: true, maxLength: 160 }
        landmark: { type: string, nullable: true, maxLength: 120 }
        city: { type: string, maxLength: 80 }
        state: { type: string, maxLength: 80 }
        postalCode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
    CustomerAddressErrorEnvelope:
      type: object
      description: >
        Covers BOTH failure sources on this path: the pre-existing CustomerAuthFilter boundary
        (UNAUTHENTICATED/SERVICE_UNAVAILABLE) and this domain's own controller (INVALID_REQUEST/
        NOT_FOUND/PRECONDITION_REQUIRED/PRECONDITION_FAILED/ADDRESS_LIMIT_REACHED/
        SERVICE_UNAVAILABLE/INTERNAL). Same flat shape either way. An unknown address id and
        another customer's address return the IDENTICAL NOT_FOUND -- no ownership enumeration.
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, UNAUTHENTICATED, NOT_FOUND, PRECONDITION_REQUIRED,
                 PRECONDITION_FAILED, ADDRESS_LIMIT_REACHED, SERVICE_UNAVAILABLE, INTERNAL]
        message: { type: string, description: "Safe, generic. No internals, no PII." }
        requestId: { type: string }
  responses:
    BadRequest:
      description: Invalid request or cursor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found (indistinguishable from hidden/inactive by design)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer }, description: seconds }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: Service temporarily unavailable
      headers:
        Retry-After: { schema: { type: integer }, description: seconds }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    OtpBadRequest:
      description: Malformed request, or an invalid/expired/locked/unknown/superseded challenge.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OtpErrorEnvelope' }
    OtpRateLimited:
      description: Rate limited
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        Retry-After: { schema: { type: integer }, description: seconds }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OtpErrorEnvelope' }
    OtpUnavailable:
      description: OTP signing key, provider, or rate limiter not configured/ready, or delivery failed.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OtpErrorEnvelope' }
    SessionBadRequest:
      description: Malformed grantId/refreshToken shape.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionErrorEnvelope' }
    SessionUnauthenticated:
      description: >
        Generic authentication failure — an invalid/consumed/expired/wrong-purpose grant, an
        invalid/expired/revoked/rotated-away/digest-mismatched refresh token, or (logout only) a
        missing/invalid customer access token. Never distinguishes which.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        WWW-Authenticate: { schema: { type: string, example: "Bearer" } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionErrorEnvelope' }
    SessionUnavailable:
      description: Access-token/refresh-token signing key or a required dependency not ready.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionErrorEnvelope' }
    ProfileBadRequest:
      description: Malformed request shape, an invalid displayName/email, or an empty patch.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerProfileErrorEnvelope' }
    ProfilePreconditionRequired:
      description: PATCH was sent without an If-Match header.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerProfileErrorEnvelope' }
    ProfilePreconditionFailed:
      description: >
        The presented If-Match no longer matches the current version — the profile changed (or was
        created) since it was last read. Persisted state is left unchanged; retry after a fresh GET.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerProfileErrorEnvelope' }
    ProfileUnauthenticated:
      description: >
        Generic customer-authentication failure (owned by CustomerAuthFilter, not this domain) — a
        missing/malformed/expired/revoked access token. Never distinguishes which.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        WWW-Authenticate: { schema: { type: string, example: "Bearer" } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerProfileErrorEnvelope' }
    ProfileUnavailable:
      description: >
        Either the customer-auth signing key/session authority is not ready (CustomerAuthFilter), or
        the profile store itself is unavailable (this domain). Never distinguishes which.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerProfileErrorEnvelope' }
    AddressBadRequest:
      description: Malformed request shape, or an invalid field value (PIN, phone, text, lat/lng pair).
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerAddressErrorEnvelope' }
    AddressNotFound:
      description: >
        Unknown address id, OR an address belonging to another customer -- the IDENTICAL response
        either way. No ownership enumeration.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerAddressErrorEnvelope' }
    AddressLimitReached:
      description: The caller's saved-address limit has been reached.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerAddressErrorEnvelope' }
    AddressPreconditionRequired:
      description: PATCH/DELETE was sent without an If-Match header.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerAddressErrorEnvelope' }
    AddressPreconditionFailed:
      description: >
        The presented If-Match no longer matches the current version. Persisted state is left
        unchanged; retry after a fresh GET.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerAddressErrorEnvelope' }
    AddressUnauthenticated:
      description: >
        Generic customer-authentication failure (owned by CustomerAuthFilter, not this domain).
        Never distinguishes which.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        WWW-Authenticate: { schema: { type: string, example: "Bearer" } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerAddressErrorEnvelope' }
    AddressUnavailable:
      description: >
        Either the customer-auth signing key/session authority is not ready (CustomerAuthFilter),
        the customer identity authority failed, or the address store itself is unavailable. Never
        distinguishes which.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CustomerAddressErrorEnvelope' }
  securitySchemes:
    customerBearerAuth:
      type: http
      scheme: bearer
      description: >
        A customer access token issued by POST /v1/auth/session or POST /v1/auth/refresh. Used by
        POST /v1/auth/logout and the /v1/customer/** endpoints in this document — no other endpoint
        here requires it, and this scheme is NOT applied globally (adding it here does not mark any
        existing PUBLIC /v1 route as authenticated).
