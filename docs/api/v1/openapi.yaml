    delete:
      tags:
      - customer-cart
      operationId: clearCustomerCart
      summary: 'Remove every item from the caller''s cart. Requires If-Match. The cart record and its version history are kept (clearing advances the version); clearing a cart that never existed is a deterministic no-op returning version 0.

        '
      security:
