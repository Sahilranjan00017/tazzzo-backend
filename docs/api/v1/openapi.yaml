      description: 'Missing/invalid customer access token (UNAUTHENTICATED).

        '
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerOrderErrorEnvelope'
    OrderNotFound:
      description: 'Unknown, foreign or malformed quote / order id (identical NOT_FOUND).

        '
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerOrderErrorEnvelope'
    OrderConflict:
      description: 'The order could not be placed: ADDRESS_CHANGED, NOT_SERVICEABLE, PRICE_CHANGED, PRODUCT_UNAVAILABLE, STOCK_UNAVAILABLE, RESERVATION_EXPIRED, or CART_VERSION_ALREADY_PURCHASED (a different quote from this cart was already ordered). Nothing was created, reserved or cleared.

        '
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerOrderErrorEnvelope'
    OrderQuoteExpired:
      description: 'The quote''s validity window has passed (QUOTE_EXPIRED). Create a new quote.

        '
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerOrderErrorEnvelope'
    OrderUnsupportedMediaType:
      description: 'Body was not `application/json` (UNSUPPORTED_MEDIA_TYPE).

        '
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerOrderErrorEnvelope'
    OrderInternalError:
      description: 'A safe, generic server error (INTERNAL). No internal detail is exposed.

        '
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerOrderErrorEnvelope'
    OrderUnavailable:
      description: 'A datastore dependency was unavailable (SERVICE_UNAVAILABLE); safe to retry the same request.

        '
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerOrderErrorEnvelope'
    DeliverySlot400:
      description: Missing or malformed pin, or days outside 1..horizon (INVALID_REQUEST)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeliverySlotErrorEnvelope'
    DeliverySlot503:
      description: Dependency unavailable (SERVICE_UNAVAILABLE)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeliverySlotErrorEnvelope'
    SupportCase400:
      description: Malformed body or parameters (INVALID_REQUEST)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupportCaseErrorEnvelope'
    SupportCase404:
      description: Unknown or someone else's case (NOT_FOUND)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupportCaseErrorEnvelope'
    SupportCase409:
      description: STATE_CONFLICT (closed case), TOO_MANY_OPEN (5 open cases) or MESSAGE_LIMIT (100 messages)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupportCaseErrorEnvelope'
    SupportCase503:
      description: Dependency unavailable (SERVICE_UNAVAILABLE)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupportCaseErrorEnvelope'
    AccountDeletionBadRequest:
      description: Missing or wrong confirmation (INVALID_REQUEST); nothing was deleted.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountDeletionErrorEnvelope'
    AccountDeletionUnavailable:
      description: Dependency unavailable or identity integrity failure (SERVICE_UNAVAILABLE); nothing was deleted.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountDeletionErrorEnvelope'
    AccountDeletionInternalError:
      description: Unexpected failure (INTERNAL); the deletion transaction rolled back.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountDeletionErrorEnvelope'
    CustomerRateLimited:
      description: 'Per-customer budget exhausted (RATE_LIMITED). Reads (GET/HEAD) and writes have separate buckets keyed by the verified customer id; enforced only when `tazzzo.customer-rate-limit.*` is configured. Retry after the given seconds.

        '
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: seconds
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            - requestId
            properties:
              code:
                type: string
                enum:
                - RATE_LIMITED
              message:
                type: string
              requestId:
                type: string
    AddressCreateConflict:
      description: 'ADDRESS_LIMIT_REACHED (the caller''s saved-address limit has been reached) or IDEMPOTENCY_CONFLICT (the Idempotency-Key was already used for a different request, or the address it created no longer exists).

        '
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerAddressErrorEnvelope'
  securitySchemes:
    customerBearerAuth:
      type: http
      scheme: bearer
      description: 'A customer access token issued by POST /v1/auth/session or POST /v1/auth/refresh. Used by POST /v1/auth/logout and the /v1/customer/** endpoints in this document — no other endpoint here requires it, and this scheme is NOT applied globally (adding it here does not mark any existing PUBLIC /v1 route as authenticated).

        '
