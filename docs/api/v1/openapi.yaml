  /v1/customer/support/cases/{caseId}/close:
    post:
      tags:
      - customer-support
      operationId: closeSupportCase
      summary: Close the case (idempotent).
      security:
      - customerBearerAuth: []
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The closed case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCase'
        '400':
          $ref: '#/components/responses/SupportCase400'
        '401':
          $ref: '#/components/responses/ProfileUnauthenticated'
        '404':
          $ref: '#/components/responses/SupportCase404'
        '409':
          $ref: '#/components/responses/SupportCase409'
        '503':
          $ref: '#/components/responses/SupportCase503'
        '406':
          $ref: '#/components/responses/SupportCaseNotAcceptable'
  /v1/customer/account/deletion:
    post:
      tags:
      - customer-account
      summary: Delete (erase) the authenticated customer's account
      description: 'One transaction: every session is revoked (all tokens stop working at the next request), profile, saved addresses, cart and checkout quotes are deleted, orders are retained as commercial records with the address snapshot anonymised, an entitling membership term is revoked, the customer row becomes a tombstone (the phone may register again as a new customer) and the phone''s OTP rows are removed. The customer is always the bearer of the token; no identifier is accepted from the body. Idempotent; a retry after completion meets 401.

        '
      security:
      - customerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirm
              properties:
                confirm:
                  type: string
                  enum:
                  - DELETE
                  description: Explicit intent; exactly DELETE.
      responses:
        '200':
          description: Deleted (also for a repeat within the same session)
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - requestId
                properties:
                  status:
                    type: string
                    enum:
                    - DELETED
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/AccountDeletionBadRequest'
        '401':
          $ref: '#/components/responses/ProfileUnauthenticated'
        '500':
          $ref: '#/components/responses/AccountDeletionInternalError'
        '503':
          $ref: '#/components/responses/AccountDeletionUnavailable'
        '406':
          $ref: '#/components/responses/AccountDeletionNotAcceptable'
        '415':
          $ref: '#/components/responses/AccountDeletionUnsupportedMediaType'
  /v1/content/home:
    get:
      tags:
      - content
      operationId: getHomeContent
      summary: 'The live HOME blocks (PUBLISHED and inside their time window, by the server clock), in display order. Banners carry a resolved `imageUrl` and a `link` from a closed grammar (`product:<id>`, `category:<node id>`, `search:<text>`); product rails and category grids carry `ids` the client renders with the existing product/category endpoints. No parameters.

        '
      responses:
        '200':
          description: 'OK. `Cache-Control: public, max-age=60`.'
          content:
            application/json:
              schema:
                type: object
                required:
                - blocks
                - requestId
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
                      required:
                      - blockId
                      - type
                      - title
                      properties:
                        blockId:
                          type: string
                        type:
                          type: string
                          enum:
                          - BANNER
                          - PRODUCT_RAIL
                          - CATEGORY_GRID
                        title:
                          type: string
                        imageUrl:
                          type: string
                        link:
                          type: string
                        ids:
                          type: array
                          items:
                            type: string
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
  /v1/app-config:
    get:
      tags:
      - content
      operationId: getAppConfig
      summary: 'Operational configuration read at app start: whether the store takes orders, a maintenance banner, the minimum supported and latest app versions per platform (force/soft update), support contacts, and the approved legal documents as https links (a null link means "not published yet"). Absent values mean "no constraint".

        '
      responses:
        '200':
          description: 'OK. `Cache-Control: public, max-age=60`.'
          content:
            application/json:
              schema:
                type: object
                required:
                - storeOpen
                - maintenance
                - android
                - ios
                - support
                - requestId
                - legal
                properties:
                  storeOpen:
                    type: boolean
                  maintenance:
                    type: object
                    required:
                    - enabled
                    properties:
                      enabled:
                        type: boolean
                      message:
                        type: string
                  android:
                    type: object
                    properties:
                      minSupported:
                        type: string
                      latest:
                        type: string
                  ios:
                    type: object
                    properties:
                      minSupported:
                        type: string
                      latest:
                        type: string
                  support:
                    type: object
                    properties:
                      phone:
                        type: string
                      email:
                        type: string
                  requestId:
                    type: string
                  legal:
                    type: object
                    required:
                    - termsUrl
                    - privacyUrl
                    - refundPolicyUrl
                    properties:
                      termsUrl:
                        type: string
                        format: uri
                        nullable: true
                      privacyUrl:
                        type: string
                        format: uri
                        nullable: true
                      refundPolicyUrl:
                        type: string
                        format: uri
                        nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
  /v1/content/faqs:
    get:
      tags:
      - content
      operationId: getHelpFaqs
      summary: 'The live help-centre FAQ (PUBLISHED FAQ blocks on the HELP placement, inside their time window), ordered by category (DELIVERY, PRODUCT, CLUB, PAYMENT, REFUND, ACCOUNT) then display order. Answers are plain text; `\n` separates paragraphs. The only accepted query parameter is `category`, once; anything else is 400.

        '
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - DELIVERY
          - PRODUCT
          - CLUB
          - PAYMENT
          - REFUND
          - ACCOUNT
      responses:
        '200':
          description: 'OK. `Cache-Control: public, max-age=60`.'
          content:
            application/json:
              schema:
                type: object
                required:
                - faqs
                - requestId
                properties:
                  faqs:
                    type: array
                    items:
                      type: object
                      required:
                      - faqId
                      - category
                      - question
                      - answer
                      properties:
                        faqId:
                          type: string
                        category:
                          type: string
                          enum:
                          - DELIVERY
                          - PRODUCT
                          - CLUB
                          - PAYMENT
                          - REFUND
                          - ACCOUNT
                        question:
                          type: string
                          maxLength: 200
                        answer:
                          type: string
                          maxLength: 2000
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
components:
  parameters:
    AddressIdParam:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        pattern: ^ADDR_[A-Za-z0-9_-]{6,64}$
    Release:
      name: release
      in: query
      required: false
      schema:
        type: string
      description: Taxonomy release id; omitted resolves the current pointer once.
    NodeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^TZ[SCGV]-[0-9]{6}$
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^TZP-[0-9]+$
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque signed cursor. Clients MUST NOT parse it.
    Pin:
      name: pin
      in: query
      required: false
      schema:
        type: string
        pattern: ^[1-9][0-9]{5}$
      description: 6-digit Indian PIN code (launch location mechanism).
    Lat:
      name: lat
      in: query
      required: false
      schema:
        type: number
      description: 'Used ONLY by GET /v1/serviceability, and ONLY when the operator has configured a geo provider; with the default (no provider) any lat/lng is 400 INVALID_REQUEST. Must be sent together with `lng`, never with `pin`. Category products and product detail remain PIN-only (lat/lng is always 400 there). Coordinates are never stored or logged.

        '
    Lng:
      name: lng
      in: query
      required: false
      schema:
        type: number
      description: 'Used ONLY by GET /v1/serviceability, and ONLY when the operator has configured a geo provider; with the default (no provider) any lat/lng is 400 INVALID_REQUEST. Must be sent together with `lng`, never with `pin`. Category products and product detail remain PIN-only (lat/lng is always 400 there). Coordinates are never stored or logged.

        '
    InstallationId:
      name: X-Tazzzo-Installation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
        pattern: ^[A-Za-z0-9\-_.:]+$
      description: Optional opaque rate-limit dimension. Never identity/authz.
  headers:
    ETag:
      description: Entity tag for conditional GET on stable/global responses.
      schema:
        type: string
    CacheControl:
      description: Cacheable (global, release-keyed) response.
      schema:
        type: string
        example: public, max-age=300, stale-while-revalidate=60
    CacheControlPrivate:
      description: Location-enriched response; never shared across locations.
      schema:
        type: string
        example: private, max-age=15
    CacheControlNoStore:
      description: Per-request auth state; never cacheable by any intermediary.
      schema:
        type: string
        example: no-store
  schemas:
    Node:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    NodeListResponse:
      type: object
      required:
      - resolvedReleaseId
      - items
      - requestId
      properties:
        resolvedReleaseId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        requestId:
          type: string
    StockState:
      type: string
      enum:
      - IN_STOCK
      - LOW_STOCK
      - OUT_OF_STOCK
      - UNKNOWN
    ProductImage:
      type: object
      required:
      - url
      - role
      - order
      properties:
        url:
          type: string
          format: uri
          description: Approved CDN host only.
        role:
          type: string
          enum:
          - PRIMARY
          - GALLERY
        order:
          type: integer
          minimum: 0
        alt:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
    ProductVariant:
      type: object
      required:
      - variantId
      - skuId
      properties:
        variantId:
          type: string
        skuId:
          type: string
        packSize:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
    ProductAttribute:
      type: object
      required:
      - key
      - label
      properties:
        key:
          type: string
        label:
          type: string
        value: {}
        unit:
          type: string
          nullable: true
    LegalInformation:
      type: object
      properties:
        manufacturer:
          type: string
          nullable: true
        countryOfOrigin:
          type: string
          nullable: true
        netQuantity:
          type: string
          nullable: true
        fssai:
          type: string
          nullable: true
        importer:
          type: string
          nullable: true
    ServiceAreaSummary:
      type: object
      required:
      - serviceable
      properties:
        serviceAreaId:
          type: string
          nullable: true
        serviceable:
          type: boolean
    ServiceabilityResponse:
      type: object
      required:
      - serviceable
      - requestId
      properties:
        serviceable:
          type: boolean
        serviceAreaId:
          type: string
          nullable: true
        serviceAreaVersion:
          type: integer
          format: int64
          nullable: true
        etaMinutesMin:
          type: integer
          nullable: true
        etaMinutesMax:
          type: integer
          nullable: true
        requestId:
          type: string
    ProductCard:
      type: object
      description: 'Public composed card = stable base fields + runtime location enrichment. Amounts are integer paise (int64). Location fields are null/UNKNOWN when no location is supplied.

        '
      required:
      - skuId
      - productId
      - name
      - stockState
      - maxOrderQuantity
      - minimumOrderQuantity
      - buyable
      properties:
        skuId:
          type: string
        productId:
          type: string
        name:
          type: string
        brandCode:
          type: string
          nullable: true
        brandName:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
        packSize:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        sellingPricePaise:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        mrpPaise:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        discountPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 99
        discountAmountPaise:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        offerSummary:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        verticalId:
          type: string
          nullable: true
        badges:
          type: array
          nullable: true
          items:
            type: string
        rating:
          type: integer
          nullable: true
          description: rating x10 (e.g. 45 = 4.5); integer to avoid floats
        ratingCount:
          type: integer
          nullable: true
        sponsored:
          type: boolean
          default: false
        stockState:
          $ref: '#/components/schemas/StockState'
        lowStockRemaining:
          type: integer
          nullable: true
        maxOrderQuantity:
          type: integer
          minimum: 0
        minimumOrderQuantity:
          type: integer
          minimum: 1
          default: 1
        serviceable:
          type: boolean
          nullable: true
        etaMinutesMin:
          type: integer
          nullable: true
        etaMinutesMax:
          type: integer
          nullable: true
        buyable:
          type: boolean
          description: 'server-derived: priced AND in stock AND serviceable AND active'
    ProductDetail:
      allOf:
      - $ref: '#/components/schemas/ProductCard'
      - type: object
        required:
        - resolvedReleaseId
        - requestId
        properties:
          description:
            type: string
            nullable: true
          highlights:
            type: array
            nullable: true
            items:
              type: string
          gallery:
            type: array
            items:
              $ref: '#/components/schemas/ProductImage'
          attributes:
            type: array
            items:
              $ref: '#/components/schemas/ProductAttribute'
          variants:
            type: array
            items:
              $ref: '#/components/schemas/ProductVariant'
          legal:
            $ref: '#/components/schemas/LegalInformation'
          serviceability:
            $ref: '#/components/schemas/ServiceabilityResponse'
          resolvedReleaseId:
            type: string
          requestId:
            type: string
    PagedProductResponse:
      type: object
      required:
      - resolvedReleaseId
      - items
      - hasMore
      - requestId
      properties:
        resolvedReleaseId:
          type: string
        serviceArea:
          $ref: '#/components/schemas/ServiceAreaSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        nextCursor:
          type: string
          nullable: true
          description: Omitted at end of list.
        hasMore:
          type: boolean
        requestId:
          type: string
    OtpRequestRequest:
      type: object
      required:
      - phone
      properties:
        phone:
          type: string
          description: 'India phone number. E.164 (+91XXXXXXXXXX) preferred; bare 10-digit or leading-zero domestic forms are also normalized. No other country is accepted.

            '
          example: '+919876543210'
    OtpRequestResponse:
      type: object
      required:
      - challengeId
      - expiresInSeconds
      - resendAfterSeconds
      - requestId
      properties:
        challengeId:
          type: string
          pattern: ^OTP_[A-Za-z0-9_-]+$
        expiresInSeconds:
          type: integer
          format: int64
        resendAfterSeconds:
          type: integer
          format: int64
        requestId:
          type: string
    OtpVerifyRequest:
      type: object
      required:
      - challengeId
      - otp
      properties:
        challengeId:
          type: string
          pattern: ^OTP_[A-Za-z0-9_-]+$
        otp:
          type: string
          pattern: ^[0-9]{6}$
    OtpVerifyResponse:
      type: object
      required:
      - challengeId
      - verified
      - grantId
      - requestId
      properties:
        challengeId:
          type: string
        verified:
          type: boolean
        grantId:
          type: string
          pattern: ^GRANT_[A-Za-z0-9_-]+$
          description: 'Opaque one-time login grant. NOT an access or refresh token; carries no phone/PII. A future phase atomically consumes it to create a customer session.

            '
        requestId:
          type: string
    OtpErrorEnvelope:
      type: object
      description: 'Independent of ErrorEnvelope (the frozen commerce-read contract) — a deliberately small, stable OTP-specific vocabulary that never distinguishes "unknown challenge" from "wrong code" from "locked" from "superseded" (all OTP_INVALID).

        '
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          enum:
          - OTP_INVALID_REQUEST
          - OTP_INVALID
          - OTP_EXPIRED
          - OTP_RATE_LIMITED
          - SERVICE_UNAVAILABLE
          - INTERNAL
        message:
          type: string
          description: Safe, generic. No internals, no OTP, no phone.
        requestId:
          type: string
        retryAfterSeconds:
          type: integer
          nullable: true
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - requestId
      - retryable
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - INVALID_CURSOR
          - NOT_FOUND
          - RATE_LIMITED
          - SERVICE_UNAVAILABLE
          - INTERNAL
        message:
          type: string
          description: Safe, generic. No internals.
        requestId:
          type: string
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          nullable: true
        details:
          type: object
          nullable: true
          description: Only when safe.
    SessionEstablishRequest:
      type: object
      required:
      - grantId
      properties:
        grantId:
          type: string
          pattern: ^GRANT_[A-Za-z0-9_-]+$
    SessionEstablishResponse:
      type: object
      description: 'sessionId and the phone number are DELIBERATELY OMITTED — the client never needs either directly; the access token carries the session internally and the refresh token embeds it as an opaque routing prefix.

        '
      required:
      - customerId
      - accessToken
      - accessTokenExpiresIn
      - refreshToken
      - requestId
      properties:
        customerId:
          type: string
          pattern: ^CUS_[A-Za-z0-9_-]+$
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: Seconds.
        refreshToken:
          type: string
        requestId:
          type: string
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    RefreshResponse:
      type: object
      description: A brand-new refresh token every time — the presented one is rotated away and never usable again, whether or not this response is ever received by the client.
      required:
      - accessToken
      - accessTokenExpiresIn
      - refreshToken
      - requestId
      properties:
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: Seconds.
        refreshToken:
          type: string
        requestId:
          type: string
    SessionErrorEnvelope:
      type: object
      description: 'Independent of ErrorEnvelope/OtpErrorEnvelope/CustomerAuthError (different trust domains). INVALID grant/refresh-token states — unknown, consumed, expired, wrong purpose, digest mismatch, revoked, rotated-away — all collapse to the SAME UNAUTHENTICATED outcome.

        '
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHENTICATED
          - SERVICE_UNAVAILABLE
          - INTERNAL
        message:
          type: string
          description: Safe, generic. No internals, no tokens, no phone.
        requestId:
          type: string
    CustomerProfileResponse:
      type: object
      description: 'Deliberately excludes phoneNormalized (auth identity data) and any Mongo internals beyond the public version counter. displayName/email are nullable — null means never set (or explicitly cleared). email is UNVERIFIED profile data only; this document never claims emailVerified=true because there is no verification step in this PR.

        '
      required:
      - customerId
      - version
      - requestId
      properties:
        customerId:
          type: string
          pattern: ^CUS_[A-Za-z0-9_-]+$
        displayName:
          type: string
          nullable: true
          maxLength: 80
        email:
          type: string
          nullable: true
          maxLength: 254
        version:
          type: integer
          format: int64
          minimum: 0
        requestId:
          type: string
    CustomerProfilePatchRequest:
      type: object
      description: 'True partial-update semantics: a field OMITTED from the body is left untouched; a field PRESENT with JSON null CLEARS it; a field PRESENT with a string sets it. A body with neither key present (including {}) is rejected as 400 INVALID_REQUEST — there is no silent no-op PATCH.

        '
      properties:
        displayName:
          type: string
          nullable: true
          maxLength: 80
        email:
          type: string
          nullable: true
          maxLength: 254
    CustomerProfileErrorEnvelope:
      type: object
      description: 'Covers BOTH failure sources on this path: the pre-existing CustomerAuthFilter boundary (UNAUTHENTICATED/SERVICE_UNAVAILABLE — an invalid/missing/revoked credential, or a signing-key/session-authority readiness failure) and this domain''s own controller (INVALID_REQUEST/PRECONDITION_REQUIRED/PRECONDITION_FAILED/SERVICE_UNAVAILABLE/INTERNAL — a request-shape problem, a missing/stale If-Match, or a profile-store outage). Same flat shape either way; a client never needs to know which layer rejected it.

        '
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHENTICATED
          - PRECONDITION_REQUIRED
          - PRECONDITION_FAILED
          - SERVICE_UNAVAILABLE
          - INTERNAL
        message:
          type: string
          description: Safe, generic. No internals, no PII.
        requestId:
          type: string
    CustomerAddressServiceability:
      type: object
      description: 'Evaluated FRESH from the existing serviceability domain on every read/response — never persisted address state. `serviceable=null` means UNKNOWN (the serviceability dependency could not currently be evaluated), deliberately distinct from `false` (a definite answer: this location is outside coverage today). Saving an address never requires it to be serviceable now.

        '
