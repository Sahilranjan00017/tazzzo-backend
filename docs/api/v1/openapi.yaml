  /v1/customer/checkout/quote:
    post:
      tags:
      - customer-checkout
      operationId: createCustomerCheckoutQuote
      summary: 'Validate the caller''s current cart against current commerce truth for one owned address and create a short-lived quote. Requires If-Match (the cart ETag reviewed) and Idempotency-Key. Replaying the same key with the same input returns the ORIGINAL quote (same id, expiry not extended, not re-priced); the same key with a different address or cart version is 409 IDEMPOTENCY_CONFLICT. Replaying the same key AFTER the quote expired is 410 QUOTE_EXPIRED (never 200): a new quote after expiry needs a new key. Does not reserve stock.

        '
      security:
      - customerBearerAuth: []
      parameters:
      - name: If-Match
        in: header
        required: true
        description: The cart ETag the customer reviewed, e.g. `"cart-3"`. Missing is 428, malformed 400, stale 412.
        schema:
          type: string
          maxLength: 40
          example: '"cart-3"'
      - name: Idempotency-Key
        in: header
        required: true
        description: Client-generated key, 8-64 chars of `[A-Za-z0-9_-]`. Scoped to the authenticated customer.
        schema:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]{8,64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCheckoutQuoteRequest'
      responses:
        '200':
          description: The committed quote (created now, or the original on an idempotent replay).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCheckoutQuote'
        '400':
          $ref: '#/components/responses/CheckoutBadRequest'
        '401':
          $ref: '#/components/responses/CheckoutUnauthenticated'
        '404':
          $ref: '#/components/responses/CheckoutNotFound'
        '409':
          $ref: '#/components/responses/CheckoutConflict'
        '410':
          $ref: '#/components/responses/CheckoutQuoteExpired'
        '412':
          $ref: '#/components/responses/CheckoutPreconditionFailed'
        '415':
          $ref: '#/components/responses/CheckoutUnsupportedMediaType'
        '428':
          $ref: '#/components/responses/CheckoutPreconditionRequired'
        '503':
          $ref: '#/components/responses/CheckoutUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerCheckoutNotAcceptable'
  /v1/customer/checkout/quotes/{quoteId}:
    get:
      tags:
      - customer-checkout
      operationId: getCustomerCheckoutQuote
      summary: 'Read one of the caller''s OWN quotes. A foreign, unknown or malformed id is the identical 404. After `expiresAt` the quote resource answers 410 QUOTE_EXPIRED (expiry is derived, the quote is not deleted, so expired is distinguishable from unknown). Never re-prices.

        '
      security:
      - customerBearerAuth: []
      parameters:
      - name: quoteId
        in: path
        required: true
        schema:
          type: string
          pattern: ^CHKQ_[A-Za-z0-9_-]{6,64}$
      responses:
        '200':
          description: The quote as it was committed, still within its validity window.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCheckoutQuote'
        '401':
          $ref: '#/components/responses/CheckoutUnauthenticated'
        '404':
          $ref: '#/components/responses/CheckoutNotFound'
        '410':
          $ref: '#/components/responses/CheckoutQuoteExpired'
        '503':
          $ref: '#/components/responses/CheckoutUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerCheckoutNotAcceptable'
  /v1/customer/orders:
    post:
      tags:
      - customer-orders
      operationId: placeCustomerOrder
      summary: 'Place a Cash-on-Delivery order from one of the caller''s OWN checkout quotes. On success the order is `CONFIRMED` with `paymentCondition` `COD_DUE`. Idempotent by `quoteId`: the first placement and any replay of the same quote both return 200 with the same order (and never reserve, consume or clear the cart again), and a replay is never re-judged: it returns the stored order and its stored money even if the benefit state has changed since. Only `quoteId`, `paymentMethod` and the optional `deliverySlotId` are read from the body; any other field is ignored. A `deliverySlotId` (an id from `GET /v1/customer/delivery/slots`) is reserved in the SAME transaction as the order: a full, closed or unknown slot is `409 DELIVERY_SLOT_UNAVAILABLE` and nothing is written; a replay never reserves again. The order''s `money` is computed authoritatively at placement and may differ from the quote''s advisory `moneyPreview`; a difference is not an error. Fails as a whole — a failed placement leaves stock, cart and orders untouched.

        '
      security:
      - customerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOrderPlaceRequest'
      responses:
        '200':
          description: The confirmed order (placed now, or the same order on an idempotent replay).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          $ref: '#/components/responses/OrderBadRequest'
        '401':
          $ref: '#/components/responses/OrderUnauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderConflict'
        '410':
          $ref: '#/components/responses/OrderQuoteExpired'
        '415':
          $ref: '#/components/responses/OrderUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/OrderInternalError'
        '503':
          $ref: '#/components/responses/OrderUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerOrderNotAcceptable'
    get:
      tags:
      - customer-orders
      operationId: listCustomerOrders
      summary: 'The caller''s OWN order history, newest first (CONFIRMED and CANCELLED). Keyset-paged: pass the previous `nextCursor` as `cursor` (opaque; malformed is 400). Only `page_size` (1..50, default 20) and `cursor` are accepted.

        '
      security:
      - customerBearerAuth: []
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: One page of order summaries. Never cached.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - requestId
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - orderId
                      - status
                      - paymentMethod
                      - itemCount
                      - subtotalPaise
                      - createdAt
                      properties:
                        orderId:
                          type: string
                        status:
                          type: string
                          enum:
                          - CONFIRMED
                          - CANCELLED
                          - OUT_FOR_DELIVERY
                          - DELIVERED
                        paymentMethod:
                          type: string
                          enum:
                          - COD
                        itemCount:
                          type: integer
                        subtotalPaise:
                          type: integer
                          format: int64
                        payablePaise:
                          type: integer
                          format: int64
                        createdAt:
                          type: string
                          format: date-time
                        cancelledAt:
                          type: string
                          format: date-time
                        deliverySlot:
                          type: object
                          required:
                          - slotId
                          - label
                          - startsAt
                          - endsAt
                          properties:
                            slotId:
                              type: string
                            label:
                              type: string
                            startsAt:
                              type: string
                              format: date-time
                            endsAt:
                              type: string
                              format: date-time
                  nextCursor:
                    type: string
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/OrderBadRequest'
        '401':
          $ref: '#/components/responses/OrderUnauthenticated'
        '503':
          $ref: '#/components/responses/OrderUnavailable'
        '406':
          $ref: '#/components/responses/CustomerOrderNotAcceptable'
  /v1/customer/orders/{orderId}:
    get:
      tags:
      - customer-orders
      operationId: getCustomerOrder
      summary: 'Read one of the caller''s OWN orders. A malformed, unknown or foreign id is the identical 404. Returns the immutable snapshot taken at placement; it is never re-derived from current product, price or address data.

        '
      security:
      - customerBearerAuth: []
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          pattern: ^ORD_[A-Za-z0-9_-]{6,64}$
      responses:
        '200':
          description: The order exactly as it was placed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '401':
          $ref: '#/components/responses/OrderUnauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '500':
          $ref: '#/components/responses/OrderInternalError'
        '503':
          $ref: '#/components/responses/OrderUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerOrderNotAcceptable'
  /health/live:
    get:
      tags:
      - platform
      summary: Liveness probe (container runtime)
      description: 'Always 200 while the process serves HTTP; never consults a dependency, so an outage can never cause a restart loop. Unauthenticated; exact path; never cached. Body holds bounded words only (no hosts, versions or errors).

        '
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /health/ready:
    get:
      tags:
      - platform
      summary: Readiness probe (load-balancer target health)
      description: '200 when this instance may receive traffic: the datastore serving gate is OPEN (verifier passed, startup complete) and MongoDB answers a bounded ping. The rate-limiter store is reported and only gates readiness when configured (TAZZZO_HEALTH_REQUIRE_RATE_LIMITER=true). A refused process or a migration job is never ready. Unauthenticated; never cached.

        '
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: Not ready (same body, status DOWN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /v1/customer/delivery/slots:
    get:
      tags:
      - customer-delivery
      operationId: listDeliverySlots
      summary: 'The delivery windows a signed-in customer can choose for a PIN over the next `days` local days (default and maximum: the configured horizon). An unserviceable PIN is 200 with `serviceable:false` and no slots.

        '
