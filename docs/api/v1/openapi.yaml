          - INVALID_REQUEST
          - PAYMENT_METHOD_UNSUPPORTED
          - UNSUPPORTED_MEDIA_TYPE
          - UNAUTHENTICATED
          - NOT_FOUND
          - QUOTE_EXPIRED
