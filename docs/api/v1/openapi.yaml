        lineTotalPaise:
          type: integer
          format: int64
          nullable: true
        buyable:
          type: boolean
          description: Derived by the existing commerce buyable logic for the requested quantity. Informational; checkout revalidates.
        issues:
          type: array
          items:
            type: string
            enum:
            - PRODUCT_UNAVAILABLE
            - PRICE_UNAVAILABLE
            - LOCATION_REQUIRED
            - UNSERVICEABLE
            - OUT_OF_STOCK
            - INSUFFICIENT_STOCK
            - STOCK_UNKNOWN
            - ENRICHMENT_UNAVAILABLE
            - PRICE_CHANGED
          description: 'PRICE_CHANGED is informational (REVALIDATE band only): the line is priced and totalled at the CURRENT price and stays buyable; checkout never rejects on it.'
    CustomerCartErrorEnvelope:
      type: object
      description: 'Covers CustomerAuthFilter failures (UNAUTHENTICATED/SERVICE_UNAVAILABLE) and this domain''s own (INVALID_REQUEST/UNSUPPORTED_MEDIA_TYPE/NOT_FOUND/PRECONDITION_REQUIRED/ PRECONDITION_FAILED/CART_ITEM_LIMIT_REACHED/SERVICE_UNAVAILABLE/INTERNAL). Unknown SKU, hidden SKU, absent line and foreign/unknown addressId are all the IDENTICAL NOT_FOUND.

        '
