          format: int32
          description: Sum of quantities.
        distinctItemCount:
          type: integer
          format: int32
        subtotalPaise:
          type: integer
          format: int64
          description: Sum of CURRENT priced line totals. NOT a final payable total; not locked.
        expiresAt:
          type: string
          format: date-time
