          enum:
          - INVALID_REQUEST
          - UNSUPPORTED_MEDIA_TYPE
          - UNAUTHENTICATED
          - NOT_FOUND
          - PRECONDITION_REQUIRED
          - PRECONDITION_FAILED
          - CART_ITEM_LIMIT_REACHED
          - SERVICE_UNAVAILABLE
          - INTERNAL
        message:
          type: string
          description: Safe, generic. No internals, no PII.
        requestId:
          type: string
    CustomerCheckoutQuoteRequest:
      type: object
      required:
      - addressId
      description: Only `addressId` is read. Any other field (price, totals, customerId, routing) is ignored and never stored.
      properties:
        addressId:
          type: string
          maxLength: 64
          example: ADDR_0123456789abcdef
    CustomerCheckoutQuote:
      type: object
      description: 'A validated snapshot at `createdAt`, valid until `expiresAt`. NOT a stock reservation, NOT a permanent price lock, NOT a guaranteed final amount. `subtotalPaise` is the canonical merchandise subtotal. `moneyPreview`, when present, is the advisory commerce money stored with the quote.

        '
      required:
      - quoteId
      - cartVersion
      - addressId
      - items
      - itemCount
      - distinctItemCount
      - subtotalPaise
      - currency
      - createdAt
      - expiresAt
      - requestId
      properties:
        quoteId:
          type: string
          pattern: ^CHKQ_[A-Za-z0-9_-]{6,64}$
        cartVersion:
          type: integer
          format: int64
        addressId:
          type: string
        items:
          type: array
          items:
            type: object
            required:
            - skuId
            - quantity
            - unitPricePaise
            - lineTotalPaise
            properties:
              skuId:
                type: string
              quantity:
                type: integer
              unitPricePaise:
                type: integer
                format: int64
              lineTotalPaise:
                type: integer
                format: int64
        itemCount:
          type: integer
        distinctItemCount:
          type: integer
        subtotalPaise:
          type: integer
          format: int64
        currency:
          type: string
          enum:
          - INR
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        benefitPreview:
          description: 'ADVISORY Benefits result stored with this quote. It is NOT final payable authority, NOT a price lock and NOT an Order commitment: Order placement re-evaluates Benefits authoritatively, and the Order result can differ if Membership state or Benefits configuration changes before placement. `subtotalPaise` remains the canonical merchandise subtotal the preview was evaluated against; this object does not make the quote a price lock or a final payable amount. The field is ABSENT on a quote created before Benefits preview existed, which is NOT the same as `applied: false` (`applied: false` means Benefits was evaluated and no benefit applied; no reason is given). Replaying a quote or reading it returns the stored preview unchanged. The examples are illustrative only.

            '
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - applied
            properties:
              applied:
                type: boolean
                enum:
                - false
                example: false
          - type: object
            additionalProperties: false
            required:
            - applied
            - discountPaise
            - discountBps
            properties:
              applied:
                type: boolean
                enum:
                - true
                example: true
              discountPaise:
                type: integer
                format: int64
                minimum: 1
                example: 500
              discountBps:
                type: integer
                minimum: 1
                maximum: 10000
                example: 500
        moneyPreview:
          type: object
          additionalProperties: false
          required:
          - merchandiseSubtotalPaise
          - benefitDiscountPaise
          - payablePaise
          description: 'ADVISORY commerce money stored with this quote: `payablePaise = merchandiseSubtotalPaise - benefitDiscountPaise`. `merchandiseSubtotalPaise` equals the quote''s `subtotalPaise`; `benefitDiscountPaise` equals `benefitPreview.discountPaise` when `benefitPreview.applied` is true and is 0 otherwise; `0 <= benefitDiscountPaise <= merchandiseSubtotalPaise`, so `payablePaise` is never negative and 0 is valid (a full discount). It reflects this stored quote only. It is NOT Payment authority, NOT a price lock and NOT a guarantee for Order placement: Order placement revalidates and computes its own authoritative money independently, and the Order''s payable may differ if Membership, Benefits configuration, Pricing or other authoritative inputs change before placement. No tax, fee, coupon, Coins or wallet component is included. The field is ABSENT on a quote created before this money preview existed, which is NOT a zero payable. Replaying a quote or reading it returns the stored values unchanged. The examples are illustrative only.

            '
          properties:
            merchandiseSubtotalPaise:
              type: integer
              format: int64
              minimum: 0
              example: 10000
            benefitDiscountPaise:
              type: integer
              format: int64
              minimum: 0
              example: 500
            payablePaise:
              type: integer
              format: int64
              minimum: 0
              example: 9500
        requestId:
          type: string
    CustomerCheckoutErrorEnvelope:
      type: object
      description: 'Safe, generic. `items` is present only for CHECKOUT_ITEM_UNAVAILABLE and lists the blocking lines with a closed reason. Never carries routing, inventory internals or PII.

        '
      required:
