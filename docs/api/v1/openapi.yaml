      - city
      - state
      - postalCode
      properties:
        label:
          type: string
          enum:
          - HOME
          - WORK
          - OTHER
        recipientName:
          type: string
          maxLength: 80
        recipientPhone:
          type: string
        addressLine1:
          type: string
          maxLength: 160
        addressLine2:
          type: string
          nullable: true
          maxLength: 160
        landmark:
          type: string
          nullable: true
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        postalCode:
          type: string
          pattern: ^[1-9][0-9]{5}$
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
    CustomerAddressPatchRequest:
      type: object
      description: 'True partial-update semantics: a field OMITTED is left untouched; addressLine2/landmark PRESENT with JSON null CLEAR it; every other field is required and can never be set null. latitude/longitude are a pair -- both keys present (each may be null to clear both) or both omitted; exactly one key present is 400. Cannot change addressId/customerId/version/ createdAt/updatedAt/isDefault (use PUT .../default for the last one).

        '
      properties:
        label:
          type: string
          enum:
          - HOME
          - WORK
          - OTHER
        recipientName:
          type: string
          maxLength: 80
        recipientPhone:
          type: string
        addressLine1:
          type: string
          maxLength: 160
        addressLine2:
          type: string
          nullable: true
          maxLength: 160
        landmark:
          type: string
          nullable: true
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        postalCode:
          type: string
          pattern: ^[1-9][0-9]{5}$
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
    CustomerAddressErrorEnvelope:
      type: object
      description: 'Covers BOTH failure sources on this path: the pre-existing CustomerAuthFilter boundary (UNAUTHENTICATED/SERVICE_UNAVAILABLE) and this domain''s own controller (INVALID_REQUEST/ NOT_FOUND/PRECONDITION_REQUIRED/PRECONDITION_FAILED/ADDRESS_LIMIT_REACHED/ SERVICE_UNAVAILABLE/INTERNAL). Same flat shape either way. An unknown address id and another customer''s address return the IDENTICAL NOT_FOUND -- no ownership enumeration.

