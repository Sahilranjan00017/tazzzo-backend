          '
        schema:
          type: string
          maxLength: 64
          example: ADDR_0123456789abcdef
      responses:
        '200':
          description: Cleared. Returns the empty cart with its new ETag.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              description: Shape "cart-<version>".
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCartResponse'
        '400':
          $ref: '#/components/responses/CartBadRequest'
        '401':
          $ref: '#/components/responses/CartUnauthenticated'
        '404':
          $ref: '#/components/responses/CartNotFound'
        '412':
          $ref: '#/components/responses/CartPreconditionFailed'
        '428':
          $ref: '#/components/responses/CartPreconditionRequired'
        '503':
