  /v1/customer/support/cases/{caseId}/messages:
    post:
      tags:
      - customer-support
      operationId: replySupportCase
      summary: Add a message. A RESOLVED case reopens (OPEN); a CLOSED case is final (409).
      security:
      - customerBearerAuth: []
      parameters:
      - name: caseId
        in: path
