          description: Canonical +91 E.164. Delivery contact only.
        addressLine1:
          type: string
          maxLength: 160
        addressLine2:
          type: string
          nullable: true
          maxLength: 160
        landmark:
          type: string
          nullable: true
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        postalCode:
