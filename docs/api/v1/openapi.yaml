          enum:
          - INVALID_REQUEST
          - UNSUPPORTED_MEDIA_TYPE
          - UNAUTHENTICATED
          - NOT_FOUND
          - PRECONDITION_REQUIRED
          - PRECONDITION_FAILED
          - IDEMPOTENCY_REQUIRED
          - IDEMPOTENCY_CONFLICT
          - CHECKOUT_CART_EMPTY
          - CHECKOUT_ITEM_UNAVAILABLE
          - CHECKOUT_UNSERVICEABLE
          - QUOTE_EXPIRED
          - SERVICE_UNAVAILABLE
          - INTERNAL
        message:
          type: string
        requestId:
          type: string
        items:
          type: array
          items:
            type: object
            required:
            - skuId
            - reason
            properties:
              skuId:
                type: string
              reason:
                type: string
                enum:
                - PRODUCT_UNAVAILABLE
                - PRICE_UNAVAILABLE
                - OUT_OF_STOCK
                - INSUFFICIENT_STOCK
                - STOCK_UNKNOWN
                - NOT_BUYABLE
    CustomerOrderPlaceRequest:
      type: object
      required:
