      parameters:
      - name: pin
        in: query
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]{5}$
      - name: days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 14
      responses:
        '200':
          description: OK. Never cached.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                - serviceable
                - timezone
                - slots
                - requestId
                properties:
                  serviceable:
                    type: boolean
                  timezone:
                    type: string
                    example: Asia/Kolkata
                  requestId:
                    type: string
                  slots:
                    type: array
                    items:
                      type: object
                      required:
                      - slotId
                      - date
                      - startsAt
                      - endsAt
                      - label
                      - status
                      properties:
                        slotId:
                          type: string
                          example: morning~2026-10-06
                          description: Opaque and stable id of this occurrence
                        date:
                          type: string
                          format: date
                        startsAt:
                          type: string
                          format: date-time
                        endsAt:
                          type: string
                          format: date-time
                        label:
                          type: string
                        status:
                          type: string
                          enum:
                          - AVAILABLE
                          - FULL
                          - CLOSED
        '400':
          $ref: '#/components/responses/DeliverySlot400'
        '401':
          $ref: '#/components/responses/ProfileUnauthenticated'
        '503':
          $ref: '#/components/responses/DeliverySlot503'
        '406':
          $ref: '#/components/responses/DeliverySlotNotAcceptable'
  /v1/search:
    get:
      tags:
      - commerce-read
      operationId: searchProducts
      summary: 'Product search. Every token of `q` (2..32 chars, at most 5 tokens, 64 chars overall) must prefix-match a token of a product''s title or brand; results are consumer-eligible products of the resolved release in deterministic id order (no relevance ranking), enriched exactly like a category page (price, stock and serviceability for `pin` when given). Keyset-paged: `cursor` is bound to the query, the page size and the location it was issued for.

        '
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
      - $ref: '#/components/parameters/Release'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Pin'
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lng'
      - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK (an empty `items` is a normal no-match answer). Never cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
  /v1/customer/orders/{orderId}/cancel:
    post:
      tags:
      - customer-orders
      operationId: cancelCustomerOrder
      summary: 'Cancel one of the caller''s OWN confirmed orders, within the cancellation window the operator configured (`tazzzo.orders.customer-cancel-window-seconds`; the default 0 means customer cancellation is closed: 409 `CANCELLATION_WINDOW_CLOSED`). One transaction returns the stock, releases the delivery slot and records who and why. Idempotent: cancelling a cancelled order is 200 with no second restock. Only `reason` is read from the body.

        '
      security:
      - customerBearerAuth: []
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  enum:
                  - CHANGED_MIND
                  - ORDERED_BY_MISTAKE
                  - OTHER
      responses:
        '200':
          description: The order, now `CANCELLED` (or already was).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          $ref: '#/components/responses/OrderBadRequest'
        '401':
          $ref: '#/components/responses/OrderUnauthenticated'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderConflict'
        '500':
          $ref: '#/components/responses/OrderInternalError'
        '503':
          $ref: '#/components/responses/OrderUnavailable'
        '406':
          $ref: '#/components/responses/CustomerOrderNotAcceptable'
        '415':
          $ref: '#/components/responses/CustomerOrderUnsupportedMediaType'
  /v1/customer/support/cases:
    post:
      tags:
      - customer-support
      operationId: openSupportCase
      summary: Open a case. `orderId` (optional) must be one of the caller's own orders. At most 5 cases may be open at once.
      security:
      - customerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - category
              - subject
              - message
              properties:
                category:
                  type: string
                  enum:
                  - ORDER_ISSUE
                  - DELIVERY
                  - PRODUCT
                  - ACCOUNT
                  - OTHER
                orderId:
                  type: string
                subject:
                  type: string
                  minLength: 1
                  maxLength: 120
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Plain text; newlines allowed, no other control characters
      responses:
        '201':
          description: The new case (status OPEN). Never cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCase'
        '400':
          $ref: '#/components/responses/SupportCase400'
        '401':
          $ref: '#/components/responses/ProfileUnauthenticated'
        '404':
          $ref: '#/components/responses/SupportCase404'
        '409':
          $ref: '#/components/responses/SupportCase409'
        '503':
          $ref: '#/components/responses/SupportCase503'
        '406':
          $ref: '#/components/responses/SupportCaseNotAcceptable'
        '415':
          $ref: '#/components/responses/SupportCaseUnsupportedMediaType'
    get:
      tags:
      - customer-support
      operationId: listSupportCases
      summary: The caller's own cases, newest-updated first, keyset-paged. Only `page_size` (1..50) and `cursor` are accepted.
      security:
      - customerBearerAuth: []
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: One page of case summaries.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - requestId
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - caseId
                      - category
                      - subject
                      - status
                      - messageCount
                      - updatedAt
                      properties:
                        caseId:
                          type: string
                        category:
                          type: string
                        subject:
                          type: string
                        status:
                          type: string
                          enum:
                          - OPEN
                          - IN_PROGRESS
                          - RESOLVED
                          - CLOSED
                        messageCount:
                          type: integer
                        updatedAt:
                          type: string
                          format: date-time
                  nextCursor:
                    type: string
                  requestId:
                    type: string
        '400':
          $ref: '#/components/responses/SupportCase400'
        '401':
          $ref: '#/components/responses/ProfileUnauthenticated'
        '404':
          $ref: '#/components/responses/SupportCase404'
        '409':
          $ref: '#/components/responses/SupportCase409'
        '503':
          $ref: '#/components/responses/SupportCase503'
        '406':
          $ref: '#/components/responses/SupportCaseNotAcceptable'
  /v1/customer/support/cases/{caseId}:
    get:
      tags:
      - customer-support
      operationId: getSupportCase
