        serviceable:
          type: boolean
          nullable: true
    CustomerAddressResponse:
      type: object
      description: 'NEVER exposes fulfillmentLocationId (internal), warehouseId, or any Mongo internal. It also intentionally omits serviceAreaId/serviceAreaVersion (public in /v1/serviceability) — the address projection is a narrower `serviceable`-only view. recipientPhone is DELIVERY CONTACT information only — never an authentication identity, never used to log in, may differ from the customer''s login phone.

        '
      required:
