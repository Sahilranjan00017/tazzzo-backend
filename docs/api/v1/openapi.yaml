          - SERVICE_UNAVAILABLE
          - INTERNAL
        message:
          type: string
        requestId:
          type: string
    HealthReport:
      type: object
      required:
      - status
      - components
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        components:
          type: object
