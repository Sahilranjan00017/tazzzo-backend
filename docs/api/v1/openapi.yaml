            title:
              type: string
            brandCode:
              type: string
              nullable: true
            imageUrl:
              type: string
              nullable: true
        price:
          nullable: true
          description: CURRENT price (not locked). Null when unavailable.
          type: object
          properties:
            unitPricePaise:
              type: integer
              format: int64
            mrpPaise:
              type: integer
              format: int64
            currency:
              type: string
              enum:
              - INR
        availability:
          type: object
          properties:
            stockState:
              type: string
              enum:
              - IN_STOCK
              - LOW_STOCK
              - OUT_OF_STOCK
