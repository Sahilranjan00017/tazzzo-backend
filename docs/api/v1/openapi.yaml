        deliverySlotId:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,31}~[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: 'Optional (required when the deployment sets `tazzzo.checkout.delivery-slot-required`). A malformed value is 400 INVALID_REQUEST; a valid one that is full, closed, unknown or outside the horizon is 409 DELIVERY_SLOT_UNAVAILABLE.

            '
    CustomerOrderLine:
      type: object
      required:
      - skuId
      - title
      - brandCode
      - quantity
      - unitPricePaise
      - lineTotalPaise
      description: Title, brand and price as they were when the order was placed.
      properties:
        skuId:
          type: string
        title:
          type: string
        brandCode:
          type: string
        quantity:
          type: integer
        unitPricePaise:
          type: integer
          format: int64
        lineTotalPaise:
          type: integer
          format: int64
    CustomerOrderAddress:
      type: object
      required:
      - label
      - recipientName
      - recipientPhone
      - addressLine1
      - city
      - state
      - postalCode
      description: 'The delivery address as it was when the order was placed (a snapshot — later address edits do not change it). Never carries coordinates or an address id/version.

        '
      properties:
        label:
          type: string
        recipientName:
          type: string
        recipientPhone:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        landmark:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
    CustomerOrder:
      type: object
      description: 'A placed order. `status` is `CONFIRMED`, then `OUT_FOR_DELIVERY` and `DELIVERED` as staff fulfil it (with `outForDeliveryAt`/`deliveredAt`), or `CANCELLED` once cancelled (then `cancelledAt` is present and there is no `paymentCondition`: nothing is due). `paymentCondition` `COD_DUE` means the order is confirmed and payment is owed on delivery; nothing has been collected. `money.payablePaise` is the amount due on delivery (it is never a statement that anything was paid); it is `0` for a fully discounted order, in which case nothing is due.

        '
      required:
      - orderId
      - status
      - paymentMethod
      - items
      - itemCount
      - subtotalPaise
      - currency
      - deliveryAddress
      - createdAt
      - confirmedAt
      - requestId
      properties:
        orderId:
          type: string
          pattern: ^ORD_[A-Za-z0-9_-]{6,64}$
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
          - OUT_FOR_DELIVERY
          - DELIVERED
        paymentMethod:
          type: string
          enum:
          - COD
        paymentCondition:
          type: string
          enum:
          - COD_DUE
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOrderLine'
        itemCount:
          type: integer
        subtotalPaise:
          type: integer
          format: int64
        currency:
          type: string
          enum:
          - INR
        deliveryAddress:
          $ref: '#/components/schemas/CustomerOrderAddress'
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        money:
          $ref: '#/components/schemas/CustomerOrderMoney'
        requestId:
          type: string
        deliverySlot:
          type: object
          additionalProperties: false
          required:
          - slotId
          - label
          - startsAt
          - endsAt
          description: The delivery window the order reserved; absent when none was chosen. Never carries capacity or internal ids.
          properties:
            slotId:
              type: string
              example: early~2026-10-06
            label:
              type: string
            startsAt:
              type: string
              format: date-time
            endsAt:
              type: string
              format: date-time
        cancelledAt:
          type: string
          format: date-time
        outForDeliveryAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
    CustomerOrderMoney:
      type: object
      additionalProperties: false
      required:
      - merchandiseSubtotalPaise
      - benefitDiscountPaise
      - payablePaise
      description: 'The AUTHORITATIVE money of this order, projected from what was persisted at placement (never recomputed when read): `payablePaise = merchandiseSubtotalPaise - benefitDiscountPaise`, and `merchandiseSubtotalPaise` equals `subtotalPaise`. The order computes it independently at placement, so it may differ from the quote''s advisory `moneyPreview`. It is the commerce amount owed, not a payment fact: nothing is authorized, captured or collected. `0 <= benefitDiscountPaise <= merchandiseSubtotalPaise`; `payablePaise` is never negative and `0` is valid. The field is ABSENT on an order created before the money model existed; absence is NEVER a zero payable. Replaying the placement or reading the order returns the same values.

        '
      properties:
        merchandiseSubtotalPaise:
          type: integer
          format: int64
          minimum: 0
          example: 10000
        benefitDiscountPaise:
          type: integer
          format: int64
          minimum: 0
          example: 500
        payablePaise:
          type: integer
          format: int64
          minimum: 0
          example: 9500
