openapi: 3.0.3
info:
  title: Tazzzo App API
  version: 1.0.0-draft
  description: 'The app-facing `/v1/**` contract: public commerce reads, customer OTP/session auth and the customer-authenticated surface. Every operation here is served, and every served `/v1/**` operation is here (`ApiContractParityIT` fails the build on drift in either direction); every documented 4xx/5xx is a JSON body requiring `code` and `message`. The admin/internal API under `/api/v1` is generated from the controllers into `services/catalog-service/docs/openapi.json`. All monetary amounts are integer paise (int64), currency INR.

    '
servers:
- url: https://api.tazzzo.com
  description: Production gateway (not yet provisioned)
tags:
- name: commerce-read
  description: Composed, consumer-ready browse contract (ADR-001, ADR-003.1).
- name: customer-auth-otp
  description: 'PR-11B — OTP challenge lifecycle only. Public (no bearer token required or honoured). Does NOT create a customer, a session, or issue any access/refresh token — a successful verify proves phone possession and produces a one-time internal login grant that PR-11C consumes to create a session.

    '
- name: customer-auth-session
  description: 'PR-11C — completes customer authentication: OTP verified grant -> customer resolution/ creation -> session -> access/refresh tokens -> refresh rotation -> logout. Session establishment and refresh are PUBLIC (no bearer required — that is how a client obtains one); logout REQUIRES a valid customer access token. Does NOT cover customer profile, addresses, cart, checkout, or orders — those are future phases.

    '
- name: customer-profile
  description: 'PR-12A — authenticated read/update of a customer''s OWN profile (displayName, email only). Both endpoints REQUIRE a valid customer access token; customerId always comes from the token, never from the request. Optimistic concurrency via ETag/If-Match. Email here is OPTIONAL, UNVERIFIED profile data — never an authentication identity, never used to log in. Does NOT cover address, cart, checkout, order, payment, or any other customer data — those are future phases.

    '
- name: customer-address
  description: 'PR-12B — authenticated CRUD of a customer''s OWN saved delivery addresses, plus dynamic serviceability binding. All endpoints REQUIRE a valid customer access token; customerId always comes from the token, never from the request. Optimistic concurrency via ETag/If-Match, the SAME pattern as customer-profile. Serviceability is evaluated FRESH on every read/response from the existing serviceability domain — it is never persisted as address state, and saving an address never requires it to currently be serviceable. The ETag `"address-<version>"` is the address-CONTENT concurrency token for PATCH/DELETE If-Match — not a complete version of the customer''s default-preference state (`isDefault` can change without the address version changing; responses are no-store). recipientPhone is delivery-contact information only, never an authentication identity. fulfillmentLocationId is internal and never exposed. serviceAreaId/serviceAreaVersion are public in the existing /v1/serviceability contract, but this address projection intentionally omits them (it exposes only the narrower `serviceable`). Does NOT cover cart, checkout, order, or payment — those are future phases.

    '
- name: customer-checkout
  description: 'PR-13A — checkout VALIDATION + QUOTE for the authenticated customer. A quote binds the exact cart version the customer reviewed (`If-Match: "cart-<n>"`), one OWNED delivery address, and current commerce truth (catalog visibility, canonical price, serviceability, inventory), and returns a short-lived (5 minutes by default) validated snapshot. Creation is ALL-OR-NOTHING (any failing line rejects the whole quote; nothing is reduced, substituted or partially quoted), idempotent (`Idempotency-Key`, scoped per customer) and never mutates the cart. A quote is NOT a reservation: NO stock is held, prices are NOT locked beyond this snapshot, and a future order must revalidate stock and quote validity. `subtotalPaise` is the sum of line totals at the quoted current prices. The optional `moneyPreview` is an ADVISORY payable preview stored with the quote: it is not Payment authority, not a price lock and not binding on Order placement, which revalidates and computes its own authoritative money (it may differ). Internal routing/fulfillment identifiers are never exposed. Order placement is a separate surface; no payment endpoint exists yet.

    '
- name: customer-orders
  description: 'PR-15A-2 — Cash-on-Delivery order placement for the authenticated customer. One operation places an order from one of the caller''s OWN checkout quotes: it confirms the order, consumes the held stock and finalizes the source cart in one atomic step, so a successful placement is directly `CONFIRMED` (there is no intermediate state to observe). `customerId` always comes from the token, never from the request. Cash on delivery is the only payment method. `paymentCondition` `COD_DUE` means the order is confirmed and payment is OWED ON DELIVERY — nothing has been collected. Placement is idempotent by `quoteId` (no `Idempotency-Key`): replaying the same quote returns the same order. The order is the immutable snapshot taken at placement — title, brand, price and address never change with later catalog, pricing or address edits. The order carries its AUTHORITATIVE `money` (merchandise subtotal, benefit discount, payable), computed at placement by revalidating Pricing, Membership and Benefits. It may differ from the quote''s ADVISORY `moneyPreview` (for example a benefit was gained or lost since the quote); that is not an error and the order''s money is the one that holds. Internal identifiers (customer, quote, reservation, address, fulfillment/routing, coordinates) are never exposed. Responses are no-store.

    '
- name: platform
  description: Unauthenticated liveness/readiness probes for the container runtime and the load balancer.
- name: customer-delivery
  description: 'Delivery windows for a PIN (customer-authenticated). Computed fresh per request in the configured delivery time zone; capacity is shown only as a status, never a count. Reserving a window happens inside checkout/order placement (a later contract), not here.

    '
- name: customer-support
  description: 'The signed-in customer''s own support cases. Ownership is always the access token; no identifier, status or role is accepted from a body. Case text is personal data and is deleted with the account.

    '
- name: customer-account
  description: Account lifecycle of the authenticated customer (deletion / erasure).
- name: content
  description: Public, same-for-everyone reads for app start and the home screen. Cacheable for 60 seconds.
- name: customer-cart
  description: 'PR-12C — the authenticated customer''s OWN cart: purchase INTENT (SKU + quantity) only. All endpoints REQUIRE a valid customer access token; ownership is always the token''s customer, never a request field. A cart is NOT a reservation: stock is not held, prices are not locked (every response shows CURRENT catalog price, stock and serviceability), and checkout MUST revalidate everything. Optimistic concurrency via ETag `"cart-<version>"` and a REQUIRED If-Match on every mutation; a customer with no cart is logical version 0 (`"cart-0"`). Age policy, by time since the last mutation: under 24 hours the cart is FRESH; from 24 hours up to and including 7 days it is kept and presented as `freshness: REVALIDATE` (lines also carry `PRICE_CHANGED` when the current price differs from the price observed when the line was set; a revalidate read never writes); strictly older than 7 days it expires (evaluated at runtime, presented empty, the version never resets). `subtotalPaise` is the sum of current line totals of buyable-priced lines and is NOT a final payable total (no fees, tax, discount or delivery). Without the optional `addressId` location context, stock is UNKNOWN, `serviceable` is null and nothing is buyable. fulfillmentLocationId / warehouse identifiers are never exposed. Does NOT cover checkout, orders, or payment — those are future phases.

    '
paths:
  /v1/categories:
    get:
      tags:
      - commerce-read
      operationId: getCategories
      summary: Flat list of consumer-visible super-categories (ROOT).
      parameters:
      - $ref: '#/components/parameters/Release'
      - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
  /v1/categories/{id}/children:
    get:
      tags:
      - commerce-read
      operationId: getCategoryChildren
      summary: Immediate consumer-visible children of a taxonomy node.
      parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/Release'
      - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK (a visible vertical returns empty items)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
  /v1/categories/{id}/products:
    get:
      tags:
      - commerce-read
      operationId: listProductsInCategory
      summary: 'Cursor-paginated ProductCard list under a node, enriched with location-specific stock/serviceability when a location is supplied.

        '
      parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/Release'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Pin'
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lng'
      - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPrivate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
  /v1/products/{id}:
    get:
      tags:
      - commerce-read
      operationId: getProductDetail
      summary: Full ProductDetail, location-enriched when a location is supplied.
      parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/Release'
      - $ref: '#/components/parameters/Pin'
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lng'
      - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
  /v1/serviceability:
    get:
      tags:
      - commerce-read
      operationId: getServiceability
      summary: Resolve a customer location to a serviceable area + ETA.
      parameters:
      - $ref: '#/components/parameters/Pin'
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lng'
      - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '406':
          $ref: '#/components/responses/PublicNotAcceptable'
      description: 'Resolve a PIN (or, when a geo provider is configured, a lat/lng) to a serviceable area. A coordinate the provider cannot place in a PIN is a normal "outside coverage" answer (`serviceable:false`); a provider outage is 503.

        '
  /v1/auth/otp/request:
    post:
      tags:
      - customer-auth-otp
      operationId: requestOtp
      summary: 'Request (or idempotently re-arm, within the resend cooldown) an OTP challenge for an India phone number. The response is IDENTICAL regardless of whether the phone belongs to an existing customer — this endpoint queries no customer data at all.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
      responses:
        '202':
          description: Challenge created or re-armed. Never contains the OTP or the phone.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '400':
          $ref: '#/components/responses/OtpBadRequest'
        '429':
          $ref: '#/components/responses/OtpRateLimited'
        '503':
          $ref: '#/components/responses/OtpUnavailable'
        '406':
          $ref: '#/components/responses/OtpNotAcceptable'
        '415':
          $ref: '#/components/responses/OtpUnsupportedMediaType'
  /v1/auth/otp/verify:
    post:
      tags:
      - customer-auth-otp
      operationId: verifyOtp
      summary: 'Verify a 6-digit OTP against an active challenge. Success produces an opaque, one-time internal login grant id — NOT a customer access or refresh token, and no session or customer is created by this call.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified. grantId is opaque and carries no phone/PII.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          $ref: '#/components/responses/OtpBadRequest'
        '429':
          $ref: '#/components/responses/OtpRateLimited'
        '503':
          $ref: '#/components/responses/OtpUnavailable'
        '406':
          $ref: '#/components/responses/OtpNotAcceptable'
        '415':
          $ref: '#/components/responses/OtpUnsupportedMediaType'
  /v1/auth/session:
    post:
      tags:
      - customer-auth-session
      operationId: establishSession
      summary: 'Consume an OTP verified grant to resolve-or-create the customer, create a login session, and issue an access token + refresh token. PUBLIC — this is how a client obtains its first token. sessionId and the phone number are never returned.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEstablishRequest'
      responses:
        '200':
          description: Session established.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEstablishResponse'
        '400':
          $ref: '#/components/responses/SessionBadRequest'
        '401':
          $ref: '#/components/responses/SessionUnauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
        '406':
          $ref: '#/components/responses/SessionNotAcceptable'
        '415':
          $ref: '#/components/responses/SessionUnsupportedMediaType'
  /v1/auth/refresh:
    post:
      tags:
      - customer-auth-session
      operationId: refreshSession
      summary: 'Rotate a refresh token for a new access token + a NEW refresh token. The presented refresh token is invalidated by this call, whether or not it is ever used again — atomic rotation (a race between two callers presenting the SAME token lets exactly one win). PUBLIC.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated. A brand-new refresh token is always returned.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/SessionBadRequest'
        '401':
          $ref: '#/components/responses/SessionUnauthenticated'
        '503':
          $ref: '#/components/responses/SessionUnavailable'
        '406':
          $ref: '#/components/responses/SessionNotAcceptable'
        '415':
          $ref: '#/components/responses/SessionUnsupportedMediaType'
  /v1/auth/logout:
    post:
      tags:
      - customer-auth-session
      operationId: logout
      summary: 'Revoke the CURRENT session (identified by the presented access token). REQUIRES a valid customer access token — despite living under the public /v1/auth/** namespace, this endpoint performs its own explicit bearer authentication. Repeated logout is safe. Does not delete the customer. No logout-all in this phase.

        '
      security:
      - customerBearerAuth: []
      responses:
        '204':
          description: Session revoked (or was already revoked — never distinguished).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/SessionUnauthenticated'
  /v1/customer/profile:
    get:
      tags:
      - customer-profile
      operationId: getCustomerProfile
      summary: 'The caller''s OWN profile. A customer who has never set one gets a deterministic default projection (displayName=null, email=null) at version 0 — no profile document is created by a GET. customerId always comes from the access token, never a path/query parameter.

        '
      security:
      - customerBearerAuth: []
      responses:
        '200':
          description: OK (a default, never-persisted projection if no profile exists yet).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              description: Opaque optimistic-concurrency tag, shape "profile-<version>". "profile-0" means no profile has been created yet.
              schema:
                type: string
                example: '"profile-0"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '401':
          $ref: '#/components/responses/ProfileUnauthenticated'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerProfileNotAcceptable'
    patch:
      tags:
      - customer-profile
      operationId: patchCustomerProfile
      summary: 'Partial update of the caller''s OWN profile. Requires If-Match (optimistic concurrency) — a missing header is 428, a stale version is 412. Only fields PRESENT in the body are changed; a field explicit-null CLEARS it; a field entirely omitted is left untouched. An empty body (or a body with neither displayName nor email) is 400. Lazily creates the profile on first PATCH (If-Match: "profile-0" against a customer with no profile yet).

        '
      security:
      - customerBearerAuth: []
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          maxLength: 40
          example: '"profile-0"'
        description: The ETag last observed for this profile ("profile-0" if none was ever read).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfilePatchRequest'
      responses:
        '200':
          description: Updated (or lazily created). Returns the full current profile projection.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              description: The NEW version tag after this mutation.
              schema:
                type: string
                example: '"profile-1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '400':
          $ref: '#/components/responses/ProfileBadRequest'
        '401':
          $ref: '#/components/responses/ProfileUnauthenticated'
        '412':
          $ref: '#/components/responses/ProfilePreconditionFailed'
        '428':
          $ref: '#/components/responses/ProfilePreconditionRequired'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerProfileNotAcceptable'
        '415':
          $ref: '#/components/responses/CustomerProfileUnsupportedMediaType'
  /v1/customer/addresses:
    get:
      tags:
      - customer-address
      operationId: listCustomerAddresses
      summary: 'The caller''s OWN saved addresses only. Ordered default-first, then most-recently-updated. No pagination (the saved-address limit is small by design).

        '
      security:
      - customerBearerAuth: []
      responses:
        '200':
          description: OK. Each item's `serviceability` is evaluated fresh, not stored state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressListResponse'
        '401':
          $ref: '#/components/responses/AddressUnauthenticated'
        '503':
          $ref: '#/components/responses/AddressUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerAddressNotAcceptable'
    post:
      tags:
      - customer-address
      operationId: createCustomerAddress
      summary: 'Save a new address for the caller. The FIRST saved address automatically becomes the default; subsequent addresses do not. Bounded by a per-customer saved-address limit (409 ADDRESS_LIMIT_REACHED once reached). Saving succeeds even if the address is CURRENTLY unserviceable — address validity is independent of commerce eligibility, which is re-evaluated dynamically on every read and again at future Checkout. With an optional `Idempotency-Key`, a retry of the same request (same customer, same key, same normalised body) returns the address the first request created, as 201 with the same `addressId`, its current state, and without counting again against the limit; the same key with a different body, or a key whose address has since been deleted, is 409 IDEMPOTENCY_CONFLICT. Without the header a create is not idempotent (unchanged).

        '
      security:
      - customerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressCreateRequest'
      responses:
        '201':
          description: Created, at version 1.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              description: Shape "address-1".
              schema:
                type: string
                example: '"address-1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressResponse'
        '400':
          $ref: '#/components/responses/AddressBadRequest'
        '401':
          $ref: '#/components/responses/AddressUnauthenticated'
        '409':
          $ref: '#/components/responses/AddressCreateConflict'
        '503':
          $ref: '#/components/responses/AddressUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerAddressNotAcceptable'
        '415':
          $ref: '#/components/responses/CustomerAddressUnsupportedMediaType'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client-generated key, 8-64 chars of `[A-Za-z0-9_-]`, scoped to the authenticated customer; remembered for a short retry window only.
        schema:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]{8,64}$
  /v1/customer/addresses/{addressId}:
    get:
      tags:
      - customer-address
      operationId: getCustomerAddress
      summary: 'The caller''s OWN address. An unknown address id AND another customer''s address return the IDENTICAL 404 — no ownership enumeration.

        '
      security:
      - customerBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AddressIdParam'
      responses:
        '200':
          description: OK.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              description: Shape "address-<version>".
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressResponse'
        '401':
          $ref: '#/components/responses/AddressUnauthenticated'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '503':
          $ref: '#/components/responses/AddressUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerAddressNotAcceptable'
    patch:
      tags:
      - customer-address
      operationId: patchCustomerAddress
      summary: 'Partial update of the caller''s OWN address. Requires If-Match. Only fields PRESENT in the body change; addressLine2/landmark may be explicit-null cleared; latitude/longitude are ALWAYS a pair (both present or both absent in the patch, never just one); every other field is required and can never be set null. Cannot change addressId, customerId, version, createdAt, updatedAt, or isDefault directly (use the dedicated default endpoint).

        '
      security:
      - customerBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AddressIdParam'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          maxLength: 40
          example: '"address-1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressPatchRequest'
      responses:
        '200':
          description: Updated. Returns the full current address projection with a new ETag.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              description: The NEW version tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressResponse'
        '400':
          $ref: '#/components/responses/AddressBadRequest'
        '401':
          $ref: '#/components/responses/AddressUnauthenticated'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '412':
          $ref: '#/components/responses/AddressPreconditionFailed'
        '428':
          $ref: '#/components/responses/AddressPreconditionRequired'
        '503':
          $ref: '#/components/responses/AddressUnavailable'
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
        '406':
          $ref: '#/components/responses/CustomerAddressNotAcceptable'
        '415':
          $ref: '#/components/responses/CustomerAddressUnsupportedMediaType'
    delete:
      tags:
      - customer-address
      operationId: deleteCustomerAddress
      summary: 'Delete the caller''s OWN address. Requires If-Match (prevents deleting a version the client never actually read). Deleting the current default deterministically promotes the most-recently-updated remaining address (or leaves zero default if none remain). Repeated delete after success is 404 (simple, idempotent-in-effect).

        '
      security:
      - customerBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AddressIdParam'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          maxLength: 40
